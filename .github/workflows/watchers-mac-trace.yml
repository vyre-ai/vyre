# Records what node needs from the macOS sandbox, to write the watcher profile as a deny-default
# allowlist. Exploratory; hosted macOS runner only.
name: watchers-mac-trace
on:
  push:
    branches: ["work/watchers"]
    paths: ["scripts/mac-trace.sh", ".github/workflows/watchers-mac-trace.yml"]
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/mac-trace.sh
