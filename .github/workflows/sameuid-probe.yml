# Can an agent at the person's uid make a call arrive as the person? (reviewer-2's three, plus the Linux analog.) Hosted runners only.
name: sameuid-probe
on:
  workflow_dispatch:
  push:
    branches: ["work/tailnet-sameuid"]
    paths: ["scripts/probe/sameuid/**", ".github/workflows/sameuid-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    name: sameuid-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: same-uid bypasses
        run: scripts/probe/sameuid/run.sh results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-sameuid-${{ matrix.os }}
          path: results
