# Refresh the golden decisions (kernel/golden/golden.json) in the CI environment, where the recorder's answers are the ones the node workflow checks. The test box differs (for one, a share server runs
# there), so a refresh made on it does not match what CI records. Push a commit whose message contains [golden-update]; the run writes allow.json, presence.json and golden.json and uploads them as an
# artifact to commit with the code that moved them (kernel/golden/allow.test.js and golden.test.js must then pass).
name: golden-refresh
on:
  push:
    branches: ["work/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[golden-update]') }}
    runs-on: ${{ (vars.CI_SELF_HOSTED == '1' && github.event_name != 'pull_request_target' && github.event.pull_request.head.repo.fork != true) && fromJSON('["self-hosted","linux-heavy"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          command -v bwrap >/dev/null || sudo apt-get -o DPkg::Lock::Timeout=300 install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: node scripts/gen-allow.mjs
      # The generated docs are built here, on the platform CI checks them on, because a Mac builds some entries (documents.*) differently.
      - run: node scripts/gen-agent-docs.mjs && node scripts/gen-docs-reference && node scripts/gen-architecture-map.mjs
      # The site pages are generated from scripts/gen-site.mjs. Regenerate them here and keep only the pages that really changed: the generator stamps today's date into the sitemap and the dated lines, which is not a change.
      - run: |
          node scripts/gen-site.mjs
          # the sitemap is kept only when a page was added or removed; a run that changes nothing but the lastmod stamps puts it back
          if [ -z "$(git diff -U0 -- site/sitemap.xml | grep '^[+-]' | grep -v '^+++' | grep -v '^---' | grep -v '<lastmod>')" ]; then git checkout -- site/sitemap.xml 2>/dev/null || true; fi
          git diff --name-only -- site | tee site-changed.txt
          tar czf site-gen.tgz -T site-changed.txt || true
      # the generated copies (scripts/sync-copies.mjs) are written here too; the files that changed travel in copies-gen.tgz
      - run: |
          node scripts/sync-copies.mjs
          node scripts/gen-surface-lists.mjs
          git diff --name-only -- local apps/app/src/store-core apps/app/src/real/member-routes.generated.js core/computers/image/computerd relay/client | tee copies-changed.txt
          tar czf copies-gen.tgz -T copies-changed.txt || true
      - run: node kernel/golden/index.js --write
      - run: node kernel/flows/golden/write.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden
          path: |
            kernel/golden/allow.json
            kernel/golden/presence.json
            kernel/golden/golden.json
            kernel/flows/golden/replay.json
            docs/index.json
            docs/reference
            docs/agents
            docs/architecture/map.md
            site-changed.txt
            site-gen.tgz
            copies-changed.txt
            copies-gen.tgz
