# The box image: build box/Dockerfile (never pushed anywhere) and boot it once. The smoke checks
# what ADR 0029 promises of the container: tini is PID 1 (run plain and through box/compose.yml), vyred answers /v1/health on its socket,
# killing vyred once brings it back through core/daemon/loop.sh with the container still up, and
# `docker stop` reaches vyred as a SIGTERM so it drains and the container exits 0 well inside the
# stop timeout. Every push to main runs it; other branches run it when a push touches any file in
# the image (the npm pack, plus box/, the web app's source and the build files). Deploys that touch box/ wait for it. Layers are cached in the Actions cache.
name: box-image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: box-image-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # The image is built from the npm pack of the repo (see "Pack like a deploy"), so every file
      # in the pack is an input: a push that changes any of them builds. A fixed path list here
      # once skipped a real break (core/sessions/sdk.js changed; the image no longer built).
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          from=$BEFORE; [ "${{ github.event_name }}" = "pull_request" ] && from=$BASE
          case "$from" in ""|0000000000000000000000000000000000000000) echo run=true >> "$GITHUB_OUTPUT"; exit 0;; esac
          files=$(gh api "repos/${{ github.repository }}/compare/$from...${{ github.sha }}" --paginate --jq '.files[] | .filename, (.previous_filename // empty)') || { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          packed=$(npm pack --dry-run --json --ignore-scripts 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const f of JSON.parse(s)[0].files)console.log(f.path)})') || { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "$packed" ] || { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          hit=$( { echo "$files" | grep -xF -f <(echo "$packed"); echo "$files" | grep -E '^(box/|apps/app/|scripts/build-app\.sh$|package(-lock)?\.json$|\.dockerignore$|\.github/workflows/box-image\.yml$)' || true; } | head -5)
          if [ -n "$hit" ]; then
            echo "image inputs changed:"; echo "$hit"; echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "no file in the image changed: skipping"; echo run=false >> "$GITHUB_OUTPUT"
          fi

  build-smoke:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: vyre-box:ci
      C: vyre-box-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The context a deploy builds from: install-box.sh unpacks the npm pack tarball into src/
      # and compose.build.yml builds that, so a file missing from package.json "files" fails here.
      - name: Pack like a deploy
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          sh scripts/build-app.sh
          tgz=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/src" --strip-components=1
          # Growth on record: release-check.sh fails an install over 20 MB.
          npm i -g --prefix "$RUNNER_TEMP/prefix" --no-audit --no-fund "$RUNNER_TEMP/$tgz" >/dev/null
          echo "vyre.tgz $(du -k "$RUNNER_TEMP/$tgz" | cut -f1) KB; installed $(du -sk "$RUNNER_TEMP/prefix" | cut -f1) KB of the 20480 KB cap; apps/app/dist $( [ -d apps/app/dist ] && du -sk apps/app/dist | cut -f1 || echo 0) KB" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SRC=$RUNNER_TEMP/src" >> "$GITHUB_ENV"
      - name: Build box/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SRC }}
          file: ${{ env.SRC }}/box/Dockerfile
          tags: vyre-box:ci
          load: true
          push: false
          cache-from: type=gha,scope=box-image
          cache-to: type=gha,scope=box-image,mode=max
      - name: Account homes exist, are private, and vyre can walk into them
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c 'set -e
            for u in 2000 2001 2063; do
              st=$(stat -c "%u:%g %a" "/home/acct/$u")
              [ "$st" = "$u:$u 710" ] || { echo "home of account $u is $st, want $u:$u 710"; exit 1; }
            done
            [ "$(ls /home/acct | wc -l)" = 64 ]
            for g in 2000 2001 2063; do id -G vyre | tr " " "\n" | grep -qx "$g" || { echo "vyre is not in group $g"; exit 1; }; done
            # Nobody but vyre is in any account group: that keeps one account out of another home.
            for g in $(seq 2000 2063); do
              m=$(getent group "$g" | cut -d: -f4)
              [ "$m" = vyre ] || { echo "group $g has members [$m], want only vyre"; exit 1; }
            done
            echo "account homes ok"'
      - name: gh is in the image, at the pinned version
        run: |
          want=$(sed -n 's/^ARG GH_VERSION=//p' box/Dockerfile)
          [ -n "$want" ]
          got=$(docker run --rm --entrypoint gh "$IMAGE" --version | head -n 1)
          echo "$got" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$got" in "gh version $want "*) ;; *) echo "gh is not the pinned $want"; exit 1 ;; esac
          docker run --rm --entrypoint sh "$IMAGE" -c 'command -v gh | grep -qx /usr/local/bin/gh && gh auth login --help >/dev/null'
      - name: Image size
        run: docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Boot
        run: |
          docker run -d --name "$C" "$IMAGE"
          cat > "$RUNNER_TEMP/health.sh" <<'EOF'
          # Wait up to $1 seconds for /v1/health over vyred's socket.
          i=0
          while [ $i -lt "$1" ]; do
            if docker exec "$C" node -e 'import("/opt/vyre/core/daemon/client.js").then(async m => { const r = await m.request("GET", "/v1/health", undefined, { timeout: 3000 }); console.log(JSON.stringify(r)); process.exit(r.error ? 1 : 0); }).catch(() => process.exit(1))' 2>/dev/null; then exit 0; fi
            [ "$(docker inspect -f '{{.State.Running}}' "$C")" = true ] || { echo "the container stopped"; exit 1; }
            i=$((i + 1)); sleep 1
          done
          echo "no health in $1 s"; exit 1
          EOF
          sh "$RUNNER_TEMP/health.sh" 60

      # The two checks below need ADR 0029's tini and loop.sh (resilience); an older image skips them.
      # The web app a deploy ships (scripts/build-app.sh). A 404 no_app on /app/ means the pack
      # step was missed.
      - name: GET /app/ serves the web app with its precache list
        if: hashFiles('apps/app/package.json') != ''
        run: |
          docker exec "$C" node -e '
            const http = require("node:http");
            const fs = require("node:fs");
            import("/opt/vyre/core/config/index.js").then(async c => {
              const socketPath = c.paths(c.home()).socket;
              const get = p => new Promise((ok, no) => http.get({ socketPath, path: p, headers: { "x-vyre-caller": "cli" } }, r => {
                let b = ""; r.setEncoding("utf8"); r.on("data", d => b += d); r.on("end", () => ok({ status: r.statusCode, type: String(r.headers["content-type"] || ""), location: r.headers.location, body: b })); }).on("error", no));
              const fail = m => { console.error("FAIL " + m); process.exit(1); };
              const pre = JSON.parse(fs.readFileSync("/opt/vyre/apps/app/dist/precache.json", "utf8"));
              const bare = await get("/app");
              if (bare.status !== 301 || bare.location !== "/app/") fail(`/app is ${bare.status} to ${bare.location}`);
              const page = await get("/app/");
              if (page.status !== 200 || !/text\/html/.test(page.type)) fail(`/app/ is ${page.status} ${page.type} ${page.body.slice(0, 120)}`);
              const entry = (/\/app\/_expo\/static\/js\/web\/entry-[^"]+\.js/.exec(page.body) || [])[0];
              if (!entry) fail("/app/ names no entry-<hash>.js");
              const js = await get(entry);
              if (js.status !== 200 || !/javascript/.test(js.type)) fail(`${entry} is ${js.status} ${js.type}`);
              const spa = await get("/app/now");
              if (spa.status !== 200 || !/text\/html/.test(spa.type)) fail(`/app/now is ${spa.status}`);
              const sw = await get("/app/sw.js");
              const list = JSON.parse((/const PRECACHE = (\[.*?\]);/.exec(sw.body) || [])[1] || "[]");
              if (sw.status !== 200 || !sw.body.includes(JSON.stringify(pre.build)) || list.length < 2 || !list.includes(entry)) fail(`/app/sw.js is ${sw.status}, ${list.length} precached, build ${pre.build}`);
              // The worker installs only when every precached file answers: one 404 and /app/ never works offline.
              for (const f of list) { const r = await get(f); if (r.status !== 200) fail(`precached ${f} is ${r.status}`); }
              const man = await get("/app/manifest.webmanifest");
              if (man.status !== 200 || !/manifest\+json/.test(man.type) || JSON.parse(man.body).start_url !== "/app/") fail(`/app/manifest.webmanifest is ${man.status} ${man.type}`);
              console.log(`/app/ 200 (${page.body.length} bytes), ${entry} ${js.body.length} bytes, /app/now 200, /app/sw.js build ${pre.build} with ${list.length} precached (all 200), manifest start_url /app/`);
            }).catch(e => { console.error(e); process.exit(1); });' | tee -a "$GITHUB_STEP_SUMMARY"

      # #40: a session runs as an account's own uid, with a home that has no ~/.vyre. Its Vyre MCP server must still reach vyred (through the session's own
      # socket) and offer tools, not the "not set up, run vyre up" stub. The stand-in claude starts the MCP server its --mcp-config names, as Claude Code does,
      # and says what it got. Run last among the boot checks: it replaces claude in this throwaway container.
      - name: A session as an account uid gets Vyre's tools (#40)
        run: |
          docker cp test/fixtures/fake-claude-box.sh "$C":/tmp/fake-claude-box.sh
          docker cp core/switchboard/testing/fake-claude.js "$C":/tmp/fake-claude.js
          docker exec -u root "$C" sh -c 'T=$(readlink -f /usr/local/bin/claude); mkdir -p /opt/vyre/core/switchboard/testing; cp /tmp/fake-claude.js /opt/vyre/core/switchboard/testing/fake-claude.js; cp /tmp/fake-claude-box.sh "$T"; chmod 755 "$T" /opt/vyre/core/switchboard/testing/fake-claude.js; head -2 "$T"'
          docker exec -u vyre "$C" /usr/local/bin/claude --version || true
          docker exec -u vyre "$C" node --input-type=module -e '
            import { call } from "/opt/vyre/core/daemon/client.js";
            const t = async (n, i) => { const r = await call(n, i, { caller: "cli", timeout: 30000 }); if (r.error) throw new Error(n + ": " + JSON.stringify(r.error)); return r.data; };
            const acct = await t("sessions.accounts.add", { provider: "claude", label: "probe", kind: "login" });
            if (!(acct.uid >= 2000)) throw new Error("no account uid: " + JSON.stringify(acct));
            const th = await t("threads.start", { cwd: "/work", prompt: "mcp-tools", provider: "claude", account: acct.id, surface: "deck" });
            const id = th.id || th.thread;
            for (let i = 0; i < 90; i++) {
              await new Promise(r => setTimeout(r, 1000));
              const g = await t("threads.get", { thread: id, limit: 200 });
              const done = g.events.find(e => e.type === "thread.text" && e.payload.done);
              if (done) {
                console.log("uid", acct.uid, "->", done.payload.text);
                if (!/^mcp vyre: [1-9][0-9]* tools$/.test(done.payload.text)) { console.log("the session got no Vyre tools"); process.exit(1); }
                process.exit(0);
              }
              if (["failed", "stopped"].includes(g.thread.status)) { console.log("thread", g.thread.status, JSON.stringify(g.events.slice(-3).map(e => e.payload))); process.exit(1); }
            }
            console.log("no reply in 90 s"); process.exit(1);'
      - name: tini is PID 1
        if: hashFiles('core/daemon/loop.sh') != ''
        run: |
          comm=$(docker exec "$C" cat /proc/1/comm)
          echo "PID 1: $comm"
          [ "$comm" = tini ]
          ! docker logs "$C" 2>&1 | grep -q "not running as PID 1"

      - name: A killed vyred comes back, the container stays up
        if: hashFiles('core/daemon/loop.sh') != ''
        run: |
          vpid() { docker exec "$C" pgrep -f 'node /opt/vyre/core/daemon/main.js' | head -1; }
          before=$(vpid); echo "vyred pid $before"
          [ -n "$before" ]
          docker exec "$C" kill -KILL "$before"
          i=0; after=""
          while [ $i -lt 30 ]; do after=$(vpid || true); [ -n "$after" ] && [ "$after" != "$before" ] && break; i=$((i + 1)); sleep 1; done
          echo "vyred pid after the kill: $after"
          [ -n "$after" ] && [ "$after" != "$before" ]
          [ "$(docker inspect -f '{{.State.Running}}' "$C")" = true ]
          [ "$(docker inspect -f '{{.RestartCount}}' "$C")" = 0 ]
          sh "$RUNNER_TEMP/health.sh" 30

      - name: docker stop drains vyred
        run: |
          start=$(date +%s)
          docker stop -t 30 "$C"
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' "$C")
          echo "stopped in ${took} s, exit $code" | tee -a "$GITHUB_STEP_SUMMARY"
          # 137 or a stop at the timeout means the SIGTERM never reached vyred and Docker killed it.
          [ "$code" = 0 ] && [ "$took" -lt 30 ]

      - name: Logs
        if: always()
        run: docker logs "$C" 2>&1 | tail -80 || true

      # The compose files must not add Docker's own init (init: true) to a service on this image:
      # then docker-init is PID 1 and tini runs as a child, warning "not running as PID 1". vyre
      # boots for real (with its tailscale, which waits at NeedsLogin); docker-api and egress, under
      # the computers profile, are created and inspected (no Init, the image's tini entrypoint).
      - name: Compose runs the image's tini as PID 1
        if: hashFiles('core/daemon/loop.sh') != ''
        env:
          VYRE_IMAGE: vyre-box:ci
          VYRE_EGRESS_AUTHKEY: tskey-ci-unused
          VYRE_EGRESS_EXIT_NODE: 100.64.0.1
          COMPOSE_PROJECT_NAME: vyreci
        run: |
          export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
          F="-f box/compose.yml -f box/compose.egress.yml"
          docker compose $F up -d tailscale vyre
          i=0; until [ "$(docker compose $F ps -q vyre)" ] && docker exec "$(docker compose $F ps -q vyre)" cat /proc/1/comm >/dev/null 2>&1; do i=$((i + 1)); [ $i -lt 30 ] || { docker compose $F logs; exit 1; }; sleep 1; done
          sleep 3
          id=$(docker compose $F ps -q vyre)
          comm=$(docker exec "$id" cat /proc/1/comm)
          echo "compose vyre PID 1: $comm" | tee -a "$GITHUB_STEP_SUMMARY"
          docker logs "$id" 2>&1 | tail -20
          [ "$comm" = tini ]
          ! docker logs "$id" 2>&1 | grep -q "not running as PID 1"
          docker compose $F --profile computers create docker-api egress
          for svc in vyre docker-api egress; do
            id=$(docker compose $F --profile computers ps -aq "$svc")
            init=$(docker inspect -f '{{.HostConfig.Init}}' "$id")
            ep=$(docker inspect -f '{{join .Config.Entrypoint " "}}' "$id")
            echo "$svc: Init=$init entrypoint=$ep" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$init" != true ] && [ "$ep" = "/usr/bin/tini --" ]
          done
      - name: Compose down
        if: always() && hashFiles('core/daemon/loop.sh') != ''
        env:
          VYRE_IMAGE: vyre-box:ci
          VYRE_EGRESS_AUTHKEY: tskey-ci-unused
          VYRE_EGRESS_EXIT_NODE: 100.64.0.1
          COMPOSE_PROJECT_NAME: vyreci
        run: docker compose -f box/compose.yml -f box/compose.egress.yml --profile computers down -v || true
