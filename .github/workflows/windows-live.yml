# The Windows app on a real, hosted Windows runner, paired with a throwaway Vyre box that runs on the testbox and
# is reached through the hosted relay. Manual only (Windows minutes cost double). Installs the app from a
# capsule-win build, runs --selftest, pairs, and exercises the confirm window, the link window and the hotkey,
# with screenshots. See scripts/windows-live/run.ps1.
name: windows-live
on:
  # workflow_dispatch only works once this file is on the default branch; until then, changing
  # scripts/windows-live/RUN on a branch runs it.
  push:
    paths: ["scripts/windows-live/RUN"]
  workflow_dispatch:
    inputs:
      run_id:
        description: "capsule-win run to take the installer from (blank: build it in this run)"
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-live-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
jobs:
  # The installer is built IN this run by the same reusable capsule-win workflow a release uses (artifact app-windows-<this commit>), so a branch
  # that has no earlier green capsule-win run, or a run on another event, never leaves this job with an empty run id. Giving run_id skips
  # the build and takes that run's installer instead.
  build:
    if: ${{ inputs.run_id == '' }}
    uses: ./.github/workflows/capsule-win.yml
    permissions:
      contents: read
  live:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The installer, from this run's build
        if: ${{ inputs.run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: app-windows-${{ github.sha }}
          path: ${{ runner.temp }}/installer
      - name: The installer, from the capsule-win run you named
        if: ${{ inputs.run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = "${{ inputs.run_id }}"
          $sha = gh run view $id --json headSha --jq .headSha
          if (-not $sha) { throw "no capsule-win run $id" }
          "capsule-win run $id on $sha"
          gh run download $id -n "app-windows-$sha" -D "$env:RUNNER_TEMP\installer"
      - name: Find the installer
        shell: pwsh
        run: |
          $f = Get-ChildItem "$env:RUNNER_TEMP\installer\Vyre_*_x64-setup.exe" | Select-Object -First 1
          if (-not $f) { throw "no Vyre_*_x64-setup.exe in $env:RUNNER_TEMP\installer" }
          "VYRE_INSTALLER=$($f.FullName)" >> $env:GITHUB_ENV
          "OUT_DIR=$env:RUNNER_TEMP\live-out" >> $env:GITHUB_ENV
      - name: Install, pair with the testbox box, and check
        shell: pwsh
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          BOX_SSH_USER: ${{ secrets.BOX_SSH_USER }}
          BOX_SSH_HOSTKEY: ${{ secrets.BOX_SSH_HOSTKEY }}
        run: ./scripts/windows-live/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-live
          path: ${{ runner.temp }}/live-out
