# The golden journeys (team/0.3.1/JOURNEYS.md, scripts/journeys/run.mjs): the product walked end to end on a real server the way a firm uses it. Once per integration tip; the newest
# tip cancels an older run. The result is one of the two checks the release PR to main needs (T8: node.yml and journeys, zero failures).
name: journeys
on:
  push:
    branches: ["work/lead-031-w"]
  workflow_dispatch:
    inputs:
      only:
        description: "One journey (J1, J2, J3, J8) or all"
        required: false
        default: "all"
permissions:
  contents: read
concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: (cd apps/app && npm ci --ignore-scripts --no-audit --no-fund)
      # The pinned chrome-headless-shell the published-React-page journey draws with (the same one node.yml installs)
      - run: node scripts/install-test-chrome.mjs
      # The saved Twenty database a new Space starts from: without it each Space makes Twenty's database and every core type (7 to 9 minutes each, 16 with the team Space), with it about 3 (issue #136).
      - uses: ./.github/actions/twenty-golden
      - name: The journeys
        run: node scripts/journeys/run.mjs "${{ inputs.only || 'all' }}" --out journeys-out
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail 80 vyre-vyre-1 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: journeys, path: journeys-out, retention-days: 14 }

  # projects-flows' screen walk (scripts/app-walk-plain.mjs): about 40 screens of the app on a seeded daemon in a real browser; a blank page, a page error, or ids, roles or "undefined" in the words fail the run.
  # Together with the journeys it is what the release PR to main needs (T8).
  plain-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: (cd apps/app && npm ci --no-audit --no-fund)
      - name: Export the web app
        run: (cd apps/app && npm run export:web)
      - name: Playwright (outside the repo)
        run: |
          echo "PW_FROM=$RUNNER_TEMP/pw/" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          echo '{"private":true}' > package.json
          npm i --no-audit --no-fund --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: The screens
        run: node scripts/app-walk-plain.mjs --dist apps/app/dist --out plain-walk-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: plain-walk, path: plain-walk-out, retention-days: 14 }
