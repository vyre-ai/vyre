# One-off probe: what RFB version does the computer image's Xvnc greet with, and which option changes it?
name: vnc-probe
on:
  push:
    branches: ["work/e2e2-j6j7"]
    paths: [".github/workflows/vnc-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t probe-computer core/computers/image >/dev/null
      - name: banners
        run: |
          probe() {
            name=$1; shift
            docker rm -f vp >/dev/null 2>&1
            docker run -d --name vp --entrypoint sh probe-computer -c "mkdir -p /tmp/h && echo secret1 | vncpasswd -f > /tmp/h/passwd; Xvnc :1 -geometry 800x600x24 -rfbport 5900 -nolisten tcp -localhost=no $* & sleep 600" >/dev/null
            sleep 4
            ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' vp)
            echo "== $name: $(node -e "const n=require('net');const c=n.connect(5900,'$ip');let b='';c.on('data',d=>{b+=d;if(b.length>=12){console.log(JSON.stringify(b.slice(0,12)));c.destroy()}});c.on('error',e=>console.log('error '+e.message));setTimeout(()=>{console.log('timeout');process.exit()},4000)")"
            docker logs vp 2>&1 | grep -i -E "protocol|error|warn" | head -3
          }
          probe none "-SecurityTypes None"
          probe vncauth "-SecurityTypes VncAuth -rfbauth /tmp/h/passwd"
          probe vncauth-always-shared "-SecurityTypes VncAuth -rfbauth /tmp/h/passwd -AlwaysShared"
          probe fullflags "-SecurityTypes VncAuth -rfbauth /tmp/h/passwd -AlwaysShared -SendCutText=0 -SendPrimary=0 -AcceptCutText=1 -MaxCutText=262144 -AcceptSetDesktopSize=0 -FrameRate=24 +extension SECURITY"
          probe proto33off "-SecurityTypes VncAuth -rfbauth /tmp/h/passwd -Protocol3.3=0"
          docker exec vp sh -c 'ls /etc/tigervnc 2>&1; cat /etc/tigervnc/* 2>&1 | head -20; env | grep -i vnc'
