# Probes for the tailnet team's matrix items that need no real tailnet (T2b). Hosted runner, loopback only.
name: tailnet-probe
on:
  workflow_dispatch:
  push:
    branches: ["work/tailnet-t2"]
    paths: ["scripts/probe/**", ".github/workflows/tailnet-probe.yml"]
permissions:
  contents: read
jobs:
  rebind-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq-base dnsutils bc
      - name: real clients against a resolver that drops the IPv6 tailnet answer
        run: scripts/probe/dns-rebind-clients.sh
  login-url:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: how long a Tailscale sign-in link keeps working (no account, never used)
        run: MAX_MIN=55 scripts/probe/login-url-lifetime.sh
  dns-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq-base dnsutils
      - name: a Pi-hole style resolver (dnsmasq --stop-dns-rebind) against the addresses a box publishes
        run: scripts/probe/dns-rebind.sh
