# Drive on a freshly installed box (#45): install a box the way a person does, make a project on the server, and check Drive lists it
# before anything is shared. Push to work/022-drive-box or dispatch it.
name: matrix-drive-box
on:
  workflow_dispatch:
  push:
    branches: ["work/022-drive-box"]
permissions:
  contents: read
concurrency:
  group: matrix-drive-box-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The site, as vyre.run serves it (the box files)
        run: sh scripts/build-site.sh
      - name: A fresh box, installed by the real installer
        run: |
          sudo mkdir -p /srv/vyre && sudo chown "$(id -u):$(id -g)" /srv/vyre
          sh scripts/matrix/box-up.sh site/box "$RUNNER_TEMP/link"
          for i in $(seq 1 60); do docker exec -u vyre vyre-vyre-1 vyre call projects.list '{}' >/dev/null 2>&1 && break; sleep 3; done
      - name: Drive on the fresh box
        run: node scripts/matrix/drive-fresh.mjs results/drive
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a; docker logs --tail 60 vyre-vyre-1 2>&1 | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-drive-box
          path: results
          retention-days: 14
