# The watcher wall on a real container (launch, for watchers): the box image is built, the spawner installs and probes the
# per-uid outbound REJECT rule at every start, drops NET_ADMIN, and a watcher child behind it is refused loopback, the internet
# and the unix socket. Runs on pushes to the paths below on work/rc-* and work/stage-0.2, or by dispatch.
name: watcher-wall
on:
  workflow_dispatch:
  push:
    branches: ["work/rc-*", "work/stage-0.2"]
    paths: ["core/spawner/**", "box/Dockerfile", "box/compose.yml", "scripts/watcher-wall-*", ".github/workflows/watcher-wall.yml"]
permissions:
  contents: read
concurrency:
  group: watcher-wall-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
jobs:
  wall:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The wall on a real container
        run: bash scripts/watcher-wall-proof.sh results
      - name: Diagnostics
        if: failure()
        run: docker logs wallbox 2>&1 | tail -30; docker logs wallbare 2>&1 | tail -10; cat results/probe.json results/build.log 2>/dev/null | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-watcher-wall, path: results, retention-days: 14 }
