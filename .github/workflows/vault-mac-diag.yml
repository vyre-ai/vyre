# Diagnostic for vault-mac: the files that hung, with a 20-second per-test timeout and full logs,
# so the test that never finishes is named. Run by hand; remove once the hang is fixed.
name: vault-mac-diag
on:
  push:
    paths: [".github/workflows/vault-mac-diag.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: What the hung tests are waiting on
        shell: bash
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { execSync } from "node:child_process";
          setTimeout(() => {
            try { console.error("ACTIVE", JSON.stringify(process.getActiveResourcesInfo())); } catch {}
            try { console.error(execSync("ps -axo pid,ppid,stat,command | egrep -i 'node|swift|security|pbcopy|osascript|helper' | grep -v egrep | cut -c1-200").toString()); } catch {}
          }, 12000).unref();
          EOF
          sed -i '' 's/^          //' /tmp/probe.mjs
          for spec in "core/vault/module.test.js|no value appears" "core/vault/surfaces.test.js|only people reach" "core/vault/tools/cli.test.js|item, resolve" "core/cli/commands/home.test.js|"; do
            f="${spec%%|*}"; pat="${spec##*|}"
            echo "=== $f $pat"
            NODE_OPTIONS="--import /tmp/probe.mjs" perl -e 'alarm 120; exec @ARGV' node --test --test-timeout=20000 --test-force-exit ${pat:+--test-name-pattern="$pat"} "$f" 2>&1 | grep -vE "^\s*$" | head -60 || true
          done
