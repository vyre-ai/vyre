# The iOS app: xcodegen, then build and unit tests on a simulator. Skips (on a cheap Linux runner)
# while apps/ios is absent, so no macOS minutes are spent.
name: ios
on:
  push:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps
      - id: check
        run: |
          if [ -f apps/ios/project.yml ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo "apps/ios is absent: skipping"; echo present=false >> "$GITHUB_OUTPUT"; fi
  build-test:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devs if "iOS" in r), reverse=True):
              for d in devs[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
      - name: Build and test
        run: |
          set +e
          xcodebuild test -project Vyre.xcodeproj -scheme Vyre \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E '^(Test Suite|Test Case .* failed|\*\* )|error:' build.log | tail -200
          exit $status
      - name: Package the simulator build
        if: always()
        run: |
          mkdir -p dist
          app=$(find build/Build/Products -path '*-iphonesimulator/Vyre.app' -maxdepth 3 | head -1)
          [ -n "$app" ] && ditto -c -k --keepParent "$app" dist/Vyre-ios-simulator.app.zip
          cp build.log dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ github.sha }}
          path: apps/ios/dist/
          retention-days: 14
      - name: Shut down simulators
        if: always()
        run: xcrun simctl shutdown all || true
