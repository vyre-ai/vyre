# Regenerates the generated docs reference (docs/index.json and docs/reference/*, with `npm run docs:ref`) on a polish branch and commits them back, because a person may not run the generator on a Mac and the
# docs-check test ("the real docs tree is clean") is red whenever a team adds or changes a tool, a module or a setting without regenerating. Built the way gen-kits-branch.yml, gen-tokens-branch.yml and regen.yml are: two
# jobs, so the write token never meets the branch's code. `regenerate` runs the branch's generator with a read-only token and no stored credentials and hands over a patch; `commit` runs none of the branch's code and
# applies the patch only when it touches exactly docs/index.json and files under docs/reference/, pinned to the head the first job saw. Only branches named work/polish/** are accepted. It runs on a push to such
# a branch that touches what docs:ref reads (a newer push cancels the older run; the bot's own token push starts nothing), and can be dispatched once the file is on the default branch.
name: gen-docs-branch
on:
  push:
    branches: ["work/polish/**"]
    # only what docs:ref reads: the shipped code roots it scans (bin, core, harness, local, modules), lib (shared descriptions), the docs pages it counts mentions in, its own generator and this file. A change to the app screens,
    # the web pages, the relay, the names Worker or the tests cannot make the reference stale, so it starts nothing.
    paths: ["bin/**", "core/**", "harness/**", "local/**", "modules/**", "lib/**", "docs/**", "scripts/gen-docs-reference", "scripts/lib/docs/**", "package.json", ".github/workflows/gen-docs-branch.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gen-docs-branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    if: startsWith(github.ref_name, 'work/polish/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.diff.outputs.stale }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # the generator loads every module's manifest and reads the code; no install script runs, and this job has a read-only token
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate the docs reference
        run: node scripts/gen-docs-reference
      - name: Keep only docs/index.json and docs/reference/, as a patch
        id: diff
        run: |
          set -eu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add -A -- docs/index.json docs/reference
          if git diff --cached --quiet; then echo "the generated docs are current"; echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          other="$(git status --porcelain | grep -v '^[AMD]  ' || true)"
          if [ -n "$other" ]; then echo "::error::the generator changed files outside docs/index.json and docs/reference:"; echo "$other"; exit 1; fi
          git diff --cached --stat
          git diff --cached --binary > "$RUNNER_TEMP/docs.patch"
          echo "stale=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.diff.outputs.stale == 'true'
        with:
          name: docs-patch
          path: ${{ runner.temp }}/docs.patch
          retention-days: 1
  commit:
    needs: regenerate
    if: needs.regenerate.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-patch
          path: ${{ runner.temp }}/patch
      - name: Apply the patch if it is only the generated docs, and push
        env:
          HEAD_SHA: ${{ needs.regenerate.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          case "$BRANCH" in work/polish/*) ;; *) echo "::error::only work/polish/** branches"; exit 1;; esac
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "the branch moved on since this run started; run it again"; exit 0; }
          p="$RUNNER_TEMP/patch/docs.patch"
          if git apply --numstat "$p" | cut -f3 | grep -v -E '^(docs/index\.json|docs/reference/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$'; then echo "::error::the patch names a path that is not generated docs"; exit 1; fi
          if git apply --numstat "$p" | cut -f3 | grep -q '\.\.'; then echo "::error::the patch names a path with .."; exit 1; fi
          if grep -E '^(old mode|new mode|rename |copy |new file mode 120000|deleted file mode 120000)' "$p"; then echo "::error::the patch changes modes, renames or links"; exit 1; fi
          git apply --index "$p"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate the generated docs reference"
          git push origin "HEAD:${BRANCH}"
