name: perf22
on:
  workflow_dispatch:
  push:
    branches: ["work/rc3/perf22"]
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: idle profile
        run: |
          VYRE_PERF_IDLEPROF=/tmp/idle.cpuprofile node scripts/perf-check 2>&1 | grep -E "CPU \(|RSS \(" || true
          node scripts/prof-tmp.mjs /tmp/idle.cpuprofile | cut -c1-400
