name: perf22
on:
  workflow_dispatch:
  push:
    branches: ["work/rc3/perf22"]
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: three runs
        run: |
          for i in 1 2 3; do
            echo "== run $i"
            VYRE_PERF_NODEARGS="--trace-gc" VYRE_PERF_GCLOG=1 node scripts/perf-check 2>&1 | grep -E "CPU \((p95|sust)|RSS \((startup|settled)|Mark-Compact" | cut -c1-150
          done
