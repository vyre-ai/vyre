name: perf22
on:
  workflow_dispatch:
  push:
    branches: ["work/rc3/perf22"]
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: gc log
        run: |
          VYRE_PERF_NODEARGS="--trace-gc" VYRE_PERF_GCLOG=1 node scripts/perf-check 2>&1 | grep -E "Mark-Compact|Scavenge|RSS \(startup|CPU \(sust" | cut -c1-170 | awk '{print}' | head -150
