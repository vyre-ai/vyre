name: perf22
on:
  workflow_dispatch:
  push:
    branches: ["work/rc3/perf22"]
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: trace
        run: |
          VYRE_PERF_TRACE=/tmp/pt.txt node scripts/perf-check 2>&1 | grep -E "perf-check:|CPU \(|RSS \(" || true
          sort -n /tmp/pt.txt.events | cut -c1-230 | tail -n +1 | awk '{ if ($2=="CPU") c++; print }' | grep -v "within.js" | tail -80
