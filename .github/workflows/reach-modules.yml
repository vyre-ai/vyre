# launch's modules after the reach pass (explicit reach on every tool): their own tests, which boot daemons, so on a runner.
name: reach-modules
on:
  workflow_dispatch:
  push:
    branches: ["main", "work/v0.3", "work/launch-*", "work/platform*", "work/kernel*"]
    paths: ["core/tips/**", "core/update/**", "core/vitals/**", "core/system/**", "core/about/**", "core/statusline/**", "core/onboard/**", "core/import/**", "test/reach-explicit.test.js", "test/reach-allowlist.json", ".github/workflows/reach-modules.yml"]
permissions:
  contents: read
concurrency:
  group: reach-modules-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
jobs:
  reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: node --test test/reach-explicit.test.js core/tips/*.test.js core/update/*.test.js core/vitals/*.test.js core/system/*.test.js core/about/*.test.js core/statusline/*.test.js core/onboard/*.test.js core/import/*.test.js
