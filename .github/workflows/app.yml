# The one Expo app (ADR 0027), apps/app, with its own package.json and lockfile outside the root;
# it imports core/resilience (Metro watchFolders), so jobs check out the whole repo
# (the box's npm ci never pulls Expo). Tests and typecheck on every push; the web export with its
# gzipped size; an Android debug APK and a release APK (minify and Hermes exercised) signed in CI with the
# Vyre release key, vyre-<version>-<sha7>.apk with android.json, published as a release on main. iOS is
# the fallback only: run by hand with the ios input, simulator build, no signing. Plain prebuild
# plus gradle/xcodebuild: no EAS, no Expo account. Skips (on a cheap runner) while
# apps/app/package.json is absent.
name: app
on:
  push:
    paths: ["apps/app/**", "core/resilience/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["apps/app/**", "core/resilience/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS simulator app (the fallback)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
env:
  VYRE_NO_DIALOGS: "1"
  EXPO_NO_TELEMETRY: "1"
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps
      - id: check
        run: |
          if [ -f apps/app/package.json ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo "apps/app/package.json is absent: skipping"; echo present=false >> "$GITHUB_OUTPUT"; fi

  test:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  web:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo export -p web --output-dir dist
      - name: Bundle size (gzipped JS, the ADR expects about 3 MB)
        run: |
          total=0
          for f in $(find dist -name '*.js'); do total=$((total + $(gzip -9c "$f" | wc -c))); done
          echo "web JS gzipped: $((total / 1024)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "web dist on disk: $(du -sh dist | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-web-${{ github.sha }}
          path: apps/app/dist
          retention-days: 14

  android:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the release on main
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # modules/vyre-signer builds native code: the NDK and CMake gradle fetches are cached.
      - run: echo "SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDK }}/ndk/27.1.12297006
            ${{ env.SDK }}/cmake/3.22.1
          key: android-ndk-27.1.12297006-cmake-3.22.1
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild -p android --no-install --clean
      # gradle builds the release unsigned (prebuild points it at the debug keystore; that one
      # line goes), then apksigner signs it with the one Vyre release key, a repo secret. With no
      # secret (a fork, or before the key exists) a throwaway key signs it, android.json says
      # "signer": "throwaway", and nothing is published. The box serves the APK as built here and
      # never re-signs it.
      - name: Release build unsigned
        run: |
          node -e '
            const fs = require("fs"), f = "android/app/build.gradle"; let s = fs.readFileSync(f, "utf8");
            const bt = s.indexOf("buildTypes"), rel = s.indexOf("release {", bt), line = "signingConfig signingConfigs.debug";
            const at = s.indexOf(line, rel);
            if (bt < 0 || rel < 0 || at < 0) { console.error("no release signingConfig to drop in " + f); process.exit(1); }
            fs.writeFileSync(f, s.slice(0, at) + "// signed after the build, by apksigner" + s.slice(at + line.length));'
      - run: ./gradlew --no-daemon assembleDebug assembleRelease
        working-directory: apps/app/android
      - name: Sign the release and write android.json
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.VYRE_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.VYRE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYRE_ANDROID_KEY_ALIAS }}
        run: |
          out=android/app/build/outputs/apk
          unsigned=$(ls $out/release/*-unsigned.apk | head -1)
          test -f "$unsigned" || { echo "no unsigned release APK"; ls -R $out; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            signer=vyre; echo "$KEYSTORE_B64" | base64 -d > "$ks"; pass="$KEYSTORE_PASS"; alias="${KEY_ALIAS:-vyre}"
          else
            signer=throwaway; pass=$(openssl rand -hex 16); alias=vyre
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$pass" -alias "$alias" -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=Vyre throwaway CI" >/dev/null 2>&1
          fi
          badging=$("$bt/aapt2" dump badging "$unsigned")
          version=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          minsdk=$(echo "$badging" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" | head -1)
          sha7=$(echo "$GITHUB_SHA" | cut -c1-7)
          mkdir -p dist-android
          name="vyre-$version-$sha7.apk"
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          export APKPASS="$pass"  # apksigner reads it from the environment, never argv
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:APKPASS --ks-key-alias "$alias" --out "dist-android/$name" "$RUNNER_TEMP/aligned.apk" </dev/null
          rm -f "$ks"
          "$bt/apksigner" verify --print-certs "dist-android/$name" | tee "$RUNNER_TEMP/certs.txt"
          cert=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1)
          cp $out/debug/*.apk dist-android/
          sum=$(sha256sum "dist-android/$name" | cut -d' ' -f1)
          size=$(stat -c %s "dist-android/$name")
          node -e 'const [v,c,sha,sum,size,min,file,signer,cert]=process.argv.slice(1); console.log(JSON.stringify({ version: v, versionCode: Number(c), sha, sha256: sum, size: Number(size), minSdk: Number(min), built: new Date().toISOString(), file, signer, cert_sha256: cert }, null, 2))' \
            "$version" "$code" "$GITHUB_SHA" "$sum" "$size" "$minsdk" "$name" "$signer" "$cert" > dist-android/android.json
          cat dist-android/android.json
          ls -l dist-android | tee -a "$GITHUB_STEP_SUMMARY"
          echo "signer=$signer" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ github.sha }}
          path: apps/app/dist-android/
          retention-days: 14
      # A push to main with the real key publishes a GitHub release the box downloads from:
      # tag android-<version>-<sha7>, the signed APK and android.json.
      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sign.outputs.signer == 'vyre'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ steps.sign.outputs.version }}-$(echo "$GITHUB_SHA" | cut -c1-7)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Android $tag" \
            --notes "The Vyre Android app, signed with the Vyre release key. android.json has the sha256." \
            "dist-android/${{ steps.sign.outputs.name }}" dist-android/android.json

  ios:
    needs: detect
    if: needs.detect.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild -p ios --clean
      - name: Simulator build, unsigned
        working-directory: apps/app/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1); scheme=$(basename "$ws" .xcworkspace)
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-sim-${{ github.sha }}
          path: apps/app/ios/build/Build/Products/Release-iphonesimulator/*.app
          retention-days: 14
