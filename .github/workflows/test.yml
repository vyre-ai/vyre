name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # docs/SPEC.md section 2, principle 8 ("Light by default"): vyred idle must stay under
      # 0.5% CPU / 150MB resident, with no timer polling faster than once a minute. Runs on the
      # full matrix rather than once, since nothing here is node-version- or OS-specific enough
      # to trust a single combination — the daemon is plain JS, and the budgets themselves are
      # meant to hold everywhere vyred runs, not just on the fastest runner.
      - run: npm run perf-check
