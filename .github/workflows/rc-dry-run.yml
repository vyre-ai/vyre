# The release-candidate dry run (RC1): everything a candidate has to pass before the user signs anything, on a throwaway key made in CI (the real key never appears here).
# Run by hand (Actions, rc-dry-run, on the branch that will be cut):
#   1. release-dist: the release folder a build makes is checked file by file (signed list, app build, installer, compose pins).
#   2. packaged-boot: the package built with a throwaway key, installed with the real installer, every listed module runs, a root-run update keeps VYRE_KERNEL and VYRE_STORE,
#      the signed web app is served and a changed file is refused, the release stamp says release, a tampered module is refused.
#   3. update-refusals: an update from an older release to the candidate (signed, kept data), and every refusal (unsigned, wrong signer, tampered, downgrade).
#   4. cosign-refusals: the image signature checks.
#   5. rc-update: the old line (v0.2.2) installed, updated to the candidate with the kernel kept on and the data intact, then rolled back.
# Rollback to the old line is step 5. Rollback between two releases that both carry a module list needs the owner's phone (test/box-update.test.js, kernel/modules/rollback-presence.test.js): a CI run has no phone.
# Real signing is a separate, approved release run; nothing here signs with the real key.
name: rc-dry-run
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc-dry-run-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-dist:
    uses: ./.github/workflows/release-dist.yml
  packaged-boot:
    uses: ./.github/workflows/packaged-boot.yml
  update-refusals:
    uses: ./.github/workflows/update-refusals.yml
  cosign-refusals:
    uses: ./.github/workflows/cosign-refusals.yml
  rc-update:
    uses: ./.github/workflows/rc-update.yml
