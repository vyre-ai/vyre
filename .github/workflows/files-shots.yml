# The Files screen's screenshot pass (apps/app/scripts/files-shots.mjs) on the SAMPLE web export: the folder picker, drag to move, and the phone's picker. Runs on a push to the files-move branch that touches it (a new workflow cannot be dispatched before it is on the default branch), or by dispatch once it is.
# Shots go up as an artifact for review. Sample world only: no real data. (app-shots.yml is the whole-app pass.)
name: files-shots
on:
  workflow_dispatch:
  push:
    branches: ["work/0.6.2/fix53/files-move"]
    paths: [".github/workflows/files-shots.yml", "apps/app/scripts/files-shots.mjs"]
permissions:
  contents: read
concurrency:
  group: files-shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Export the sample web app
        run: npm run export:web:mock
      - name: Playwright (outside the repo)
        run: |
          echo "PW_FROM=$RUNNER_TEMP/pw/" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          echo '{"private":true}' > package.json
          npm i --no-audit --no-fund --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Shots
        run: node scripts/files-shots.mjs "$RUNNER_TEMP/files-shots" --dist dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: files-shots
          path: ${{ runner.temp }}/files-shots
          retention-days: 14
