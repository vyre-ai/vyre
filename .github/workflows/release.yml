# A Vyre release (ADR 0033, section 4). A tag vX.Y.Z publishes a GitHub Release on the stable
# channel; vX.Y.Z-beta.N and vX.Y.Z-rc.N publish a prerelease on beta. The assets are what
# scripts/build-site.sh makes for the box (install-box.sh, compose.yml, compose.build.yml,
# vyre.env.example, vyre, Dockerfile, dockerignore, vyre.tgz, VERSION), the unsigned Android APK
# (as android-<version>-<sha7>.apk) and android.json from app.yml's run on the same commit when there is one, and release.json
# { version, channel, commit, date, min_from, notes }. SHA256SUMS covers them all, and each gets
# a build provenance attestation (keyless: the workflow's OIDC identity, no key and no secret).
# notes is this version's CHANGELOG section ("## X.Y.Z" or "## X.Y.Z-beta.N"; an rc without its own
# section takes "## X.Y.Z"), also the release
# body. Nothing is published until the repo variable VYRE_RELEASES is "go". min_from is "0.1.0" unless release/min_from says otherwise. The tag must match
# package.json's version. Clients read the Releases API: stable is the newest non-prerelease,
# beta the newest of any. Run by hand with a tag to build and check everything without publishing.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build (vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N); a dry run, nothing is published"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read        # app.yml's Android artifact and capsule-mac.yml's Capsule
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      # DRY RUN until the lead says go: publishing also needs the repo variable VYRE_RELEASES=go
      # (unset today). Until then every run, a tag push included, uploads its assets as a workflow
      # artifact and publishes nothing.
      PUBLISH: ${{ github.event_name == 'push' && vars.VYRE_RELEASES == 'go' }}
      # A dry run may carry the placeholder release key; a publishing run may not (scripts/check-release-key.mjs).
      VYRE_ALLOW_PLACEHOLDER_KEY: ${{ (github.event_name == 'push' && vars.VYRE_RELEASES == 'go') && 'no' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag push builds the tag; a dry run builds the branch it was dispatched on, so a release
          # candidate is checked before anything is tagged.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version, channel and notes
        run: |
          case "$TAG" in
            v*-beta.*|v*-rc.*) channel=beta ;;
            v*) channel=stable ;;
            *) echo "not a release tag: $TAG"; exit 1 ;;
          esac
          version=${TAG#v}
          pkg=$(node -p 'require("./package.json").version')
          [ "$pkg" = "$version" ] || { echo "the tag says $version but package.json says $pkg: bump it first"; exit 1; }
          mkdir -p dist
          # This version's CHANGELOG section: from its "## <version>" heading to the next "## ". A
          # release candidate (X.Y.Z-rc.N) without its own section takes the X.Y.Z one it previews.
          node -e '
            const [v] = process.argv.slice(1), lines = require("fs").readFileSync("CHANGELOG.md", "utf8").split("\n");
            const find = want => lines.findIndex(l => l.startsWith("## ") && l.replace(/^##\s+v?/, "").split(/\s/)[0] === want);
            let at = find(v);
            if (at < 0 && /-rc\.\d+$/.test(v)) at = find(v.replace(/-rc\.\d+$/, ""));
            if (at < 0) { console.error(`CHANGELOG.md has no "## ${v}" section`); process.exit(1); }
            let end = lines.findIndex((l, i) => i > at && l.startsWith("## "));
            if (end < 0) end = lines.length;
            process.stdout.write(lines.slice(at + 1, end).join("\n").trim() + "\n");' "$version" > dist/notes.md
          min_from=$( [ -f release/min_from ] && tr -d ' \n' < release/min_from || echo 0.1.0 )
          echo "VERSION=$version" >> "$GITHUB_ENV"; echo "CHANNEL=$channel" >> "$GITHUB_ENV"; echo "MIN_FROM=$min_from" >> "$GITHUB_ENV"
          echo "$TAG: version $version, channel $channel, min_from $min_from" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The tag's commit is on main (a publishing run signs; a commit off main never does)
        if: env.PUBLISH == 'true'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "the tag's commit is not on main; refusing to sign a release from it"; exit 1; }
      - name: What changed in the signing path since the last published release (for the approver)
        # The approval on the `sign` job happens BEFORE that job starts, so the look has to be here, in
        # the build job's summary, which is already written while the approval is pending. The base is
        # the last release the publish job actually made (a tag anyone can push proves nothing).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev^{commit}" >/dev/null; then base=$prev
          else prev=""; base=$(git hash-object -t tree /dev/null); fi
          paths=".github/workflows scripts/sign-manifest.mjs scripts/check-release-key.mjs core/vyre-core/release.js local/capsule/native/build.sh"
          {
            echo "### Signing path: $TAG vs ${prev:-nothing (no published release yet)}"
            if git diff --quiet "$base" HEAD -- $paths; then
              echo "no changes to the signing path"
            else
              echo '```'
              git diff --stat "$base" HEAD -- $paths
              echo '```'
              git diff "$base" HEAD -- $paths > "$RUNNER_TEMP/signing.diff" || true
              n=$(wc -l < "$RUNNER_TEMP/signing.diff" | tr -d ' ')
              echo "full diff: $n lines"
              echo '```diff'
              head -n 400 "$RUNNER_TEMP/signing.diff"
              echo '```'
              if [ "$n" -gt 400 ]; then echo "**TRUNCATED: $((n - 400)) more lines. Read the full diff before approving.**"; fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The Capsule (Vyre.app) from capsule-mac.yml on this commit, for the Mac server install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow capsule-mac.yml --commit "$sha" --status success -L 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n "capsule-mac-$sha" -D "$RUNNER_TEMP/capsule" 2>/dev/null && [ -f "$RUNNER_TEMP/capsule/Vyre-capsule.app.zip" ]; then
            echo "VYRE_CAPSULE_ZIP=$RUNNER_TEMP/capsule/Vyre-capsule.app.zip" >> "$GITHUB_ENV"
            echo "Capsule: from capsule-mac run $id, in vyre.tgz" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = true ]; then
            echo "no green capsule-mac run on $sha: a publishing release must carry the Capsule for the Mac install"; exit 1
          else
            echo "Capsule: no green capsule-mac run on $sha, this dry run has no Vyre.app" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Box files and vyre.tgz, as build-site.sh makes them (unsigned, this job never sees the signing key)
        run: |
          sh scripts/build-site.sh
          for f in install-box.sh install-mac-server.sh compose.yml compose.build.yml vyre.env.example vyre Dockerfile dockerignore vyre.tgz VERSION; do
            [ -f "site/box/$f" ] || { echo "build-site made no $f"; exit 1; }
            cp "site/box/$f" dist/
          done
      - name: The Android app from app.yml on this commit, when there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow app.yml --commit "$sha" --status success -L 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n "app-android-$sha" -D "$RUNNER_TEMP/android" 2>/dev/null; then
            # Released as android-<version>-<sha7>.apk (ADR 0033), the name vyre update looks for;
            # android.json's file follows. Same bytes, so its sha256 still holds.
            apk="android-$VERSION-$(echo "$sha" | cut -c1-7).apk"
            cp "$(ls "$RUNNER_TEMP"/android/vyre-*.apk | head -1)" "dist/$apk"
            node -e 'const fs = require("fs"), [src, dst, file] = process.argv.slice(1); const j = JSON.parse(fs.readFileSync(src, "utf8")); j.file = file; fs.writeFileSync(dst, JSON.stringify(j, null, 2) + "\n")' \
              "$RUNNER_TEMP/android/android.json" dist/android.json "$apk"
            echo "Android: from app.yml run $id" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Android: no green app.yml run on $sha, released without the APK" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: shell.json, the phone shell's file hashes (pwa), so the one signature covers it
        run: |
          # scripts/shell-hashes.mjs lands with the pwa team's branch; until it is on this branch there is no shell.json.
          if [ -f scripts/shell-hashes.mjs ]; then node scripts/shell-hashes.mjs dist "$VERSION"; [ -f dist/shell.json ] || { echo "shell-hashes made no dist/shell.json"; exit 1; }
          else echo "no scripts/shell-hashes.mjs on this branch yet: no shell.json" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: release.json and SHA256SUMS
        run: |
          node -e '
            const fs = require("fs"), [version, channel, commit, min_from] = process.argv.slice(1);
            fs.writeFileSync("dist/release.json", JSON.stringify({ version, channel, commit, date: new Date().toISOString(), min_from,
              notes: fs.readFileSync("dist/notes.md", "utf8") }, null, 2) + "\n");' "$VERSION" "$CHANNEL" "$(git rev-parse HEAD)" "$MIN_FROM"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name notes.md | sed 's|^\./||' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          { echo "### SHA256SUMS in this build lists $(wc -l < dist/SHA256SUMS | tr -d ' ') files (the sign step adds manifest.json and signs it)"; cat dist/SHA256SUMS; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.TAG }}
          path: dist/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH != 'true'
        with:
          name: release-dry-run-${{ env.TAG }}
          path: dist/
          retention-days: 7

  # The ONLY job that sees the release signing key: the GitHub Environment `release` holds it, needs
  # the user's approval, and takes deployments only from main or v* tags. It gets the built files as
  # an artifact, signs the tarball's manifest, and hands back manifest.json, SHA256SUMS and SHA256SUMS.sig.
  sign:
    needs: release
    if: github.event_name == 'push' && vars.VYRE_RELEASES == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag's commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "the tag's commit is not on main; refusing to sign a release from it"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ env.TAG }}
          path: dist
      - name: Sign SHA256SUMS (the one signature the Mac installer and the Linux updater both verify)
        env:
          VYRE_SIGNING_KEY: ${{ secrets.VYRE_RELEASE_SIGNING_KEY }}
        run: |
          version=$(cat dist/VERSION)
          channel=$(node -p 'require("./dist/release.json").channel')
          node scripts/sign-manifest.mjs dist "$version" "$channel"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ env.TAG }}
          path: |
            dist/manifest.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          retention-days: 1

  publish:
    needs: [release, sign]
    if: github.event_name == 'push' && vars.VYRE_RELEASES == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # the release
      id-token: write      # the attestation's keyless identity
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ env.TAG }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: manifest-${{ env.TAG }}
          path: dist
      - name: The signed files are all there
        run: |
          for f in manifest.json SHA256SUMS SHA256SUMS.sig; do [ -f "dist/$f" ] || { echo "no signed $f to publish"; exit 1; }; done
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL=$(node -p 'require("./dist/release.json").channel')
          VERSION=$(cat dist/VERSION)
          pre=""; [ "$CHANNEL" = beta ] && pre="--prerelease"
          assets=$(find dist -maxdepth 1 -type f ! -name notes.md | LC_ALL=C sort)
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Vyre $VERSION" --notes-file dist/notes.md $pre $assets
