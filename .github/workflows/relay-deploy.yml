# The one gated deploy of the four Cloudflare Workers 0.2.0 needs: the relay (relay.vyre.run), the name directory (names.vyre.run),
# the hosted web app (app.vyre.run) and the camera page (wink.vyre.run). Nothing here runs until a person dispatches it, and the real deploy waits for the
# `deploy` environment's required reviewer (the same reviewer as `release`) after the dry runs have been read.
#
#   gh workflow run relay-deploy.yml --ref work/stage-0.2 -f sha=<the stage sha> -f relay=true -f names=true
#
# The Cloudflare token is the environment secret CLOUDFLARE_API_TOKEN, and the account id is the repository or environment
# variable CLOUDFLARE_ACCOUNT_ID (an id is not a secret). Exact token scopes are in docs/work/tailnet.md ("Cloudflare token").
name: relay-deploy
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The stage commit to deploy (40 hex). It must be on work/stage-0.2."
        required: true
        type: string
      relay:
        description: "Deploy relay/worker (relay.vyre.run)"
        type: boolean
        default: false
      names:
        description: "Deploy names/worker (names.vyre.run)"
        type: boolean
        default: false
      app:
        description: "Deploy relay/app (app.vyre.run). Needs app_out_run."
        type: boolean
        default: false
      app_out_run:
        description: "The run id of the release run that uploaded the signed `app-out` artifact (for app)"
        required: false
        type: string
      wink:
        description: "Deploy relay/wink (wink.vyre.run). Needs wink_out_run."
        type: boolean
        default: false
      wink_out_run:
        description: "The run id of the release run that uploaded the signed `wink-out` artifact (for wink)"
        required: false
        type: string
      names_admin_secret:
        description: "Also set the names Worker's ADMIN_SECRET (the support-only rebind) from the environment's NAMES_ADMIN_SECRET"
        type: boolean
        default: false
      relay_edge_rule:
        description: "Also write the relay's per-address edge cap (a Cloudflare rate-limit rule on /v1/pair and /v1/setup/mbx; needs the token's Zone WAF Edit scope on vyre.run)"
        type: boolean
        default: false
      names_secrets:
        description: "Also set the names Worker's runtime secrets CF_API_TOKEN and CF_ZONE_ID from the environment's NAMES_CF_API_TOKEN and NAMES_CF_ZONE_ID (first deploy only)"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: relay-deploy
  cancel-in-progress: false
env:
  # wrangler is installed once from tools/wrangler/package-lock.json (npm ci --ignore-scripts), never resolved fresh by npx
  W: ${{ github.workspace }}/tools/wrangler/node_modules/.bin/wrangler
jobs:
  dry-run:
    name: dry run (no credentials, nothing is changed)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: this workflow runs from main or stage only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || [ "$REF" = refs/heads/work/stage-0.2 ] || { echo "::error::dispatch this from main or work/stage-0.2, not $REF"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: the sha is on stage
        env:
          SHA: ${{ inputs.sha }}
        run: |
          printf %s "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::sha must be 40 hex characters"; exit 1; }
          git fetch -q origin work/stage-0.2
          git merge-base --is-ancestor "$SHA" origin/work/stage-0.2 || { echo "::error::$SHA is not on work/stage-0.2"; exit 1; }
          echo "deploying $(git rev-parse --short=12 HEAD): $(git log -1 --format=%s)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: wrangler, from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/wrangler && "$W" --version
      - name: relay/worker, dry run
        if: ${{ inputs.relay }}
        working-directory: relay/worker
        run: |
          "$W" deploy --dry-run --outdir /tmp/relay-out 2>&1 | tee /tmp/relay-dry.txt; grep -E "ROUTES|TICKETS|DEVICE_LIMITER|PAIR_LIMITER|SETUP_" /tmp/relay-dry.txt
      - name: names/worker, dry run
        if: ${{ inputs.names }}
        working-directory: names/worker
        run: |
          "$W" deploy --dry-run --outdir /tmp/names-out 2>&1 | tee /tmp/names-dry.txt; grep -E "DIRECTORY|NAMES_LIMITER|ZONE|ORIGIN" /tmp/names-dry.txt
      - name: relay/app, the signed build to deploy (the release workflow's run for this commit, signature verified)
        if: ${{ inputs.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.app_out_run }}
          SHA: ${{ inputs.sha }}
        run: scripts/deploy/fetch-app-out.sh "$RUN" "$SHA"
      - name: relay/app, dry run
        if: ${{ inputs.app }}
        working-directory: relay/app
        run: |
          "$W" deploy --dry-run --outdir /tmp/app-out-bundle 2>&1 | tee /tmp/app-dry.txt; grep -E "ASSETS|Assets|assets" /tmp/app-dry.txt
      - name: relay/wink, the signed build to deploy (the release workflow's run for this commit, signature verified)
        if: ${{ inputs.wink }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.wink_out_run }}
          SHA: ${{ inputs.sha }}
        run: scripts/deploy/fetch-wink-out.sh "$RUN" "$SHA"
      - name: relay/wink, dry run
        if: ${{ inputs.wink }}
        working-directory: relay/wink
        run: |
          "$W" deploy --dry-run --outdir /tmp/wink-out-bundle 2>&1 | tee /tmp/wink-dry.txt; grep -E "ASSETS|Assets|assets" /tmp/wink-dry.txt
  deploy:
    name: deploy (waits for the deploy environment's reviewer)
    needs: dry-run
    runs-on: ubuntu-24.04
    environment: deploy
    timeout-minutes: 20
    steps:
      - name: this workflow runs from main or stage only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || [ "$REF" = refs/heads/work/stage-0.2 ] || { echo "::error::dispatch this from main or work/stage-0.2, not $REF"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: wrangler, from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/wrangler && "$W" --version
      - name: the credentials are there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::the deploy environment has no CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set (a variable, not a secret)"; exit 1; }
          "$W" whoami 2>&1 | sed -E 's/[A-Za-z0-9._-]*@[A-Za-z0-9._-]*/<email>/' | head -12
      - name: relay/worker
        if: ${{ inputs.relay }}
        working-directory: relay/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$W" deploy
      - name: names/worker
        if: ${{ inputs.names }}
        working-directory: names/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$W" deploy
      - name: names/worker secrets (first deploy only)
        if: ${{ inputs.names && inputs.names_secrets }}
        working-directory: names/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NAMES_CF_API_TOKEN: ${{ secrets.NAMES_CF_API_TOKEN }}
          NAMES_CF_ZONE_ID: ${{ secrets.NAMES_CF_ZONE_ID }}
        run: |
          [ -n "$NAMES_CF_API_TOKEN" ] && [ -n "$NAMES_CF_ZONE_ID" ] || { echo "::error::NAMES_CF_API_TOKEN and NAMES_CF_ZONE_ID must be environment secrets"; exit 1; }
          printf %s "$NAMES_CF_API_TOKEN" | "$W" secret put CF_API_TOKEN
          printf %s "$NAMES_CF_ZONE_ID" | "$W" secret put CF_ZONE_ID
      - name: relay edge cap rule (per address, Cloudflare rate limiting)
        if: ${{ inputs.relay && inputs.relay_edge_rule }}
        env:
          # A separate token, scoped to Zone WAF Edit on vyre.run, for this step only: the deploy token never needs that scope.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_TOKEN }}
          CF_ZONE_ID: ${{ secrets.NAMES_CF_ZONE_ID }}
        run: node scripts/deploy/relay-edge-rule.mjs --apply
      - name: names/worker admin secret (support-only rebind)
        if: ${{ inputs.names && inputs.names_admin_secret }}
        working-directory: names/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NAMES_ADMIN_SECRET: ${{ secrets.NAMES_ADMIN_SECRET }}
        run: |
          [ "${#NAMES_ADMIN_SECRET}" -ge 32 ] || { echo "::error::NAMES_ADMIN_SECRET must be an environment secret of at least 32 characters (make one with: openssl rand -hex 32)"; exit 1; }
          printf %s "$NAMES_ADMIN_SECRET" | "$W" secret put ADMIN_SECRET
      - name: relay/app, the signed build (checked again here)
        if: ${{ inputs.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.app_out_run }}
          SHA: ${{ inputs.sha }}
        run: scripts/deploy/fetch-app-out.sh "$RUN" "$SHA"
      - name: relay/app
        if: ${{ inputs.app }}
        working-directory: relay/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$W" deploy
      - name: relay/wink, the signed build (checked again here)
        if: ${{ inputs.wink }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.wink_out_run }}
          SHA: ${{ inputs.sha }}
        run: scripts/deploy/fetch-wink-out.sh "$RUN" "$SHA"
      - name: relay/wink
        if: ${{ inputs.wink }}
        working-directory: relay/wink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$W" deploy
      - name: what is live
        run: |
          for u in ${{ inputs.relay && 'https://relay.vyre.run/' || '' }} ${{ inputs.names && 'https://names.vyre.run/v1/names/check?name=probe-deploy' || '' }} ${{ inputs.app && 'https://app.vyre.run/' || '' }} ${{ inputs.wink && 'https://wink.vyre.run/' || '' }}; do
            [ -n "$u" ] && printf '%s -> HTTP %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
          done
