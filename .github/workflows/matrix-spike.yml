# e2e2's 0.2 matrix spike, round 2: E2 (a private tailnet across hosted runners, the macOS runner
# as the box) and MB3's first question (can a hosted macOS runner run Colima's VM).
# Report only: it installs nothing of Vyre, signs in nowhere and publishes nothing. The headscale
# here lives for the run; each node's key is single use and expires in 20 minutes.
name: matrix-spike
on:
  push:
    branches: ["work/ci-e2e2-matrix"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  e2-control:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: headscale behind a throwaway Cloudflare quick tunnel
        run: |
          set -eu
          curl -fsSLo hs.deb https://github.com/juanfont/headscale/releases/download/v0.26.1/headscale_0.26.1_linux_amd64.deb
          sudo apt-get -qq install -y ./hs.deb >/dev/null
          curl -fsSLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x cloudflared
          (./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > cf.log 2>&1 &)
          for i in $(seq 1 60); do URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1); [ -n "$URL" ] && break; sleep 1; done
          echo "control $URL"
          sudo mkdir -p /etc/headscale /var/lib/headscale
          sudo tee /etc/headscale/config.yaml >/dev/null <<EOF
          server_url: $URL
          listen_addr: 127.0.0.1:8080
          metrics_listen_addr: 127.0.0.1:9090
          noise: { private_key_path: /var/lib/headscale/noise_private.key }
          prefixes: { v4: 100.64.0.0/10, v6: fd7a:115c:a1e0::/48, allocation: sequential }
          derp: { server: { enabled: false }, urls: [https://controlplane.tailscale.com/derpmap/default], auto_update_enabled: true, update_frequency: 24h }
          database: { type: sqlite, sqlite: { path: /var/lib/headscale/db.sqlite } }
          dns: { magic_dns: false, override_local_dns: false, base_domain: matrix.internal }
          unix_socket: /var/run/headscale/headscale.sock
          EOF
          sudo mkdir -p /var/run/headscale
          (sudo headscale serve > hs.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs "$URL/health" >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS "$URL/health"; echo
          sudo headscale users create matrix >/dev/null
          uid=$(sudo headscale users list -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          K1=$(sudo headscale preauthkeys create -u "$uid" -e 20m -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          K2=$(sudo headscale preauthkeys create -u "$uid" -e 20m -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          mkdir rv && printf '%s\n%s\n' "$URL" "$K2" > rv/rv.txt
          echo "K1=$K1" >> "$GITHUB_ENV"; echo "URL=$URL" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: rv, path: rv, retention-days: 1 }
      - name: This runner joins and serves a page on the tailnet; wait for the Mac
        run: |
          set -u
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          t0=$(date +%s)
          sudo tailscale up --login-server "$URL" --authkey "$K1" --hostname linux-device --accept-dns=false
          echo "linux joined in $(( $(date +%s) - t0 )) s: $(tailscale ip -4)"
          echo "hello from the linux device" > index.html; (python3 -m http.server 8000 --bind "$(tailscale ip -4)" >/dev/null 2>&1 &)
          for i in $(seq 1 90); do
            if sudo headscale nodes list | grep -q mac-box; then echo "mac-box is on the tailnet after $(( $(date +%s) - t0 )) s"; break; fi; sleep 10
          done
          sudo headscale nodes list
          for i in $(seq 1 60); do tailscale ping -c 1 mac-box 2>&1 | tail -1 | grep -q pong && break; sleep 5; done
          tailscale ping -c 3 mac-box || true
          tailscale status
          sleep 120
  mb3-colima:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: MB3 first question - can this runner run Colima's VM
        run: |
          sysctl -n machdep.cpu.brand_string kern.hv_vmm_present 2>&1 || true
          brew install colima docker >/dev/null 2>&1
          t0=$(date +%s)
          if colima start --vm-type vz --cpu 2 --memory 2 2>&1 | tail -8 && docker info >/dev/null 2>&1; then
            echo "colima up in $(( $(date +%s) - t0 )) s"; docker run --rm hello-world | head -2
          else echo "colima did not start after $(( $(date +%s) - t0 )) s"; colima status 2>&1 | tail -3; fi
  e2-mac-box:
    if: false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Find the control URL and key (the artifact rendezvous)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -u
          for i in $(seq 1 90); do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name=="rv") | .id' 2>/dev/null)
            [ -n "$id" ] && break; sleep 10
          done
          echo "artifact $id after $((i * 10)) s"
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > rv.zip && unzip -o -q rv.zip
          echo "URL=$(sed -n 1p rv.txt)" >> "$GITHUB_ENV"; echo "K2=$(sed -n 2p rv.txt)" >> "$GITHUB_ENV"; rm rv.txt rv.zip
      - name: The macOS runner joins as the box (open source tailscaled, no app, no system extension)
        run: |
          set -u
          brew install tailscale >/dev/null 2>&1
          (sudo tailscaled --state=/tmp/ts.state --socket=/tmp/ts.sock > ts.log 2>&1 &)
          sleep 3; t0=$(date +%s)
          sudo tailscale --socket=/tmp/ts.sock up --login-server "$URL" --authkey "$K2" --hostname mac-box --accept-dns=false
          echo "mac joined in $(( $(date +%s) - t0 )) s: $(tailscale --socket=/tmp/ts.sock ip -4)"
          for i in $(seq 1 30); do tailscale --socket=/tmp/ts.sock ping -c 1 linux-device 2>&1 | grep -q pong && break; sleep 5; done
          tailscale --socket=/tmp/ts.sock ping -c 3 linux-device || true
          ip=$(tailscale --socket=/tmp/ts.sock status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print([p["TailscaleIPs"][0] for p in d["Peer"].values() if p["HostName"]=="linux-device"][0])')
          curl -s -m 10 "http://$ip:8000/" || echo "no page over the tailnet"
          tailscale --socket=/tmp/ts.sock status
      - name: MB3 first question - can this runner run Colima's VM
        run: |
          sysctl kern.hv_support 2>&1; sysctl -n machdep.cpu.brand_string
          brew install colima docker >/dev/null 2>&1
          t0=$(date +%s)
          if colima start --vm-type vz --cpu 2 --memory 2 2>&1 | tail -5; then
            echo "colima up in $(( $(date +%s) - t0 )) s"; docker run --rm --platform linux/arm64 hello-world | head -2
          else echo "colima did not start"; fi
