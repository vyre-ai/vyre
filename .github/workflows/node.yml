# The Node suite: core, web, modules, the box and the tests that run anywhere, plus the perf
# budget gate (SPEC principle 8: vyred idle under 0.5% CPU / 150 MB, nothing polling faster than
# once a minute). The Mac-only tests run in capsule-mac.yml.
name: node
on:
  push:
    # ci's throwaway proof branches (work/ci-box-*, work/ci-app, ...) prove one other workflow.
    branches-ignore: ["work/ci-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Team branches run Node 22 only, the version box/Dockerfile ships (test/node-runtime.test.js keeps the two in step); stage, main and pull requests run 22 and 24. A work branch that
        # tested only the newer Node left the shipped runtime untested until main.
        node: ${{ fromJSON((startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2') && '[22]' || '[22, 24]') }}
        # Five shards (node --test-shard) so a run is about a fifth of the suite per job; the eval and the perf gate run on shard 1 only.
        shard: [1, 2, 3, 4, 5]
    # Every branch runs on the hosted runner. The self-hosted test-box runners (8 cores, shared) were CPU-bound
    # and left node jobs queued for hours. Set the repo variable NODE_ON_TESTBOX=1 to send team branches (work/*
    # except the stage mirror) back to the test box; those runs also cap test concurrency at 2.
    runs-on: ${{ (vars.NODE_ON_TESTBOX == '1' && startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2') && fromJSON('["self-hosted","linux-heavy"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The sandbox tests run for real (the self-test of the home sandbox needs bubblewrap), not skipped. Ubuntu 24.04 restricts unprivileged user namespaces for it, so the runner allows them.
      # (gocryptfs and fuse3 as runner-linux.yml has them: the lent-computer tests mount the encrypted workspace for real, and are counted)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap gocryptfs fuse3 && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true)
      - run: npm ci --no-audit --no-fund
      # The phone app's tests (apps/app/**) import @noble/*, which only apps/app's own lockfile installs; scripts are off, nothing builds.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/app
      # scripts/test-counts.mjs runs one process per file with a time limit; VYRE_TEST_SHARD takes every fifth file, VYRE_TEST_CONCURRENCY caps the test box's load.
      - run: npm test
        env:
          VYRE_TEST_SHARD: ${{ matrix.shard }}/5
          VYRE_TEST_CONCURRENCY: ${{ runner.environment != 'github-hosted' && '2' || '' }}
          VYRE_TEST_COUNTS_KEEP: ${{ runner.temp }}/test-counts-run.json
      - if: ${{ always() && runner.environment == 'github-hosted' && matrix.node == 22 }}
        # This shard's counts, to record into test/test-counts.json (node scripts/test-counts.mjs update <file>).
        uses: actions/upload-artifact@v4
        with:
          name: test-counts-run-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-counts-run.json
          if-no-files-found: ignore
      - if: ${{ github.event_name == 'pull_request' && matrix.node == 22 && matrix.shard == 1 }}
        # A test count that fell must come with a deleted test( or it( in the diff (scripts/test-counts.mjs).
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }} && node scripts/test-counts.mjs diff origin/${{ github.base_ref }}
      - if: ${{ matrix.shard == 1 }}
        run: npm run eval:answer
      - if: ${{ matrix.shard == 1 }}
        run: npm run perf-check
      # When the budget is over, the same check again with a CPU profile of vyred, uploaded, so the red names what ran at idle instead of guessing (scripts/perf-check PERF_CPU_PROF_DIR).
      - if: ${{ failure() && matrix.shard == 1 }}
        run: PERF_CPU_PROF_DIR="$RUNNER_TEMP/cpuprof" npm run perf-check || true
      - if: ${{ failure() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-cpuprofile
          path: ${{ runner.temp }}/cpuprof
          if-no-files-found: ignore
  # Windows support (ADR 0037): the Windows-relevant tests on windows-latest (`npm run test:windows`,
  # only files that pass there), so a red result means something, and it blocks: a regression cannot
  # hide. It is bounded to 10 minutes so it cannot hold up stage. No eval:answer or perf-check, which assume a Linux/Mac process model.
  test-windows:
    runs-on: windows-latest
    # The full suite took over 30 minutes here and held up stage landings. This runs the tests
    # that can differ on Windows (config, CLI kit and commands, voice, boundaries, docs, the relay
    # client), each bounded, and must finish inside 10 minutes. It lists only files that pass on
    # Windows, so a red result means something; the files left out, each with its reason, are in
    # team/archive/work-journals/windows.md ("Known Windows gaps").
    timeout-minutes: 10
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:windows
  # Windows LOW (security review, ADR 0037): the local vyred socket's privacy, verified on a real
  # windows-latest runner rather than hardware. Not continue-on-error: the lead's call was that
  # Tier A ships marked "preview" with the gap written down if this cannot be made to pass, not
  # that it ships unverified and green. win32's socket is a named pipe (core/config/index.js's
  # socketPath), which needs no folder or ACL - an earlier round of this job tried a filesystem-
  # backed AF_UNIX socket with an explicit icacls grant, which failed with EACCES every time; a
  # from-scratch bind with no ACL applied at all failed the same way, and whoami /priv showed
  # SeCreateSymbolicLinkPrivilege (needed to create the reparse point a bound socket file is)
  # Disabled for this token - not an ACL problem, a wrong choice of Windows primitive. This job
  # proves the actual security property instead: a real vyred starts, its socket answers, the
  # owner can connect, and a second local user's connection is refused.
  windows-socket-acl:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start vyred, then prove the socket's privacy, all in one step
        id: start
        shell: pwsh
        # Split across step boundaries before this, vyred (started via Start-Process in an
        # earlier step) was gone by the time a later step tried to connect: alive and logged "up"
        # right after listen(), dead moments later, no error anywhere (stdout, stderr, vyred's own
        # log). GitHub's windows-latest runners tear down a step's child processes when that step
        # ends more readily than -WindowStyle Hidden alone protects against; every check that
        # needs vyred alive now runs in the one step that started it.
        run: |
          $env:VYRE_HOME = "$env:RUNNER_TEMP\vyre-home"
          $env:VYRE_NO_DIALOGS = "1"
          # a home on Windows is 0.3.0: a development build with the file key is the one way vyred starts here (core/daemon/host-guard.js windowsHome), for this socket proof
          $env:VYRE_KERNEL_FILE_KEY = "1"
          New-Item -ItemType Directory -Force -Path $env:VYRE_HOME | Out-Null
          $proc = Start-Process -FilePath node -ArgumentList "core/daemon/main.js" -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\vyred.out" -RedirectStandardError "$env:RUNNER_TEMP\vyred.err" -WindowStyle Hidden
          "pid=$($proc.Id)" >> $env:GITHUB_OUTPUT
          # win32's socket is a named pipe (core/config/index.js's socketPath), not a filesystem
          # path; NPFS still answers Test-Path against \\.\pipe\<name>.
          # vyred makes the pipe's random token when it first asks for the socket path. Wait for it, so this
          # probe reads vyred's token instead of racing it to make its own (a race made this flaky).
          for ($i = 0; $i -lt 150 -and -not (Test-Path "$env:VYRE_HOME\pipe-token"); $i++) { Start-Sleep -Milliseconds 200 }
          $sockPath = (node -e "import('./core/config/index.js').then(c => console.log(c.paths(process.env.VYRE_HOME).socket))").Trim()
          "sock=$sockPath" >> $env:GITHUB_OUTPUT
          $found = $false
          # Detect the pipe by really connecting to it: Test-Path against \\.\pipe\ was flaky on loaded runners
          # (vyred was up and listening, the listing just did not show the name).
          $pipeName = $sockPath -replace '^\\\\\.\\pipe\\', ''
          for ($i = 0; $i -lt 400; $i++) {
            try {
              $c = New-Object System.IO.Pipes.NamedPipeClientStream('.', $pipeName, [System.IO.Pipes.PipeDirection]::InOut)
              $c.Connect(300); $c.Dispose(); $found = $true; break
            } catch { Start-Sleep -Milliseconds 150 }
          }
          if (-not $found) {
            Write-Output "--- vyred.out ---"; Get-Content "$env:RUNNER_TEMP\vyred.out" -ErrorAction SilentlyContinue
            Write-Output "--- vyred.err ---"; Get-Content "$env:RUNNER_TEMP\vyred.err" -ErrorAction SilentlyContinue
            $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            Write-Output "--- vyred process ($($proc.Id)) still running: $([bool]$alive) ---"
            $log = Get-ChildItem "$env:RUNNER_TEMP\vyre-home\logs" -Filter *.log -ErrorAction SilentlyContinue | Select-Object -Last 1
            if ($log) { Write-Output "--- $($log.FullName) ---"; Get-Content $log.FullName -ErrorAction SilentlyContinue }
            throw "vyred did not create its socket at $sockPath"
          }

          node scripts/win-connect-probe.mjs "$sockPath"
          if ($LASTEXITCODE -ne 0) {
            $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            Write-Output "--- vyred process ($($proc.Id)) still running: $([bool]$alive) ---"
            Write-Output "--- vyred.out ---"; Get-Content "$env:RUNNER_TEMP\vyred.out" -ErrorAction SilentlyContinue
            Write-Output "--- vyred.err ---"; Get-Content "$env:RUNNER_TEMP\vyred.err" -ErrorAction SilentlyContinue
            $log = Get-ChildItem "$env:RUNNER_TEMP\vyre-home\logs" -Filter *.log -ErrorAction SilentlyContinue | Select-Object -Last 1
            if ($log) { Write-Output "--- $($log.FullName) ---"; Get-Content $log.FullName -ErrorAction SilentlyContinue }
            throw "the owner could not connect to their own socket"
          }

          # Reviewer, section 7a point 2b: vyred must win the pipe's first instance and refuse
          # rather than silently move to a different name on conflict. A second vyred against the
          # SAME home must exit quickly and never bind a second time. (core/daemon/index.js's
          # existsSync+ping pre-check should catch this generically; this proves it against a
          # named pipe specifically, not assumed from the POSIX case.)
          $second = Start-Process -FilePath node -ArgumentList "core/daemon/main.js" -PassThru -Wait `
            -RedirectStandardOutput "$env:RUNNER_TEMP\vyred2.out" -RedirectStandardError "$env:RUNNER_TEMP\vyred2.err" -WindowStyle Hidden
          if ($second.ExitCode -eq 0) {
            Write-Output "--- vyred2.out ---"; Get-Content "$env:RUNNER_TEMP\vyred2.out" -ErrorAction SilentlyContinue
            Write-Output "--- vyred2.err ---"; Get-Content "$env:RUNNER_TEMP\vyred2.err" -ErrorAction SilentlyContinue
            throw "a second vyred against the same home exited 0 instead of refusing to start"
          }
          # And the first vyred must still be the one actually listening, not replaced.
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "the first vyred died while a second one tried to start against the same home" }
          node scripts/win-connect-probe.mjs "$sockPath"
          if ($LASTEXITCODE -ne 0) { throw "the original vyred stopped answering after a conflicting second start attempt" }

          # net user warns interactively (and hangs, non-interactive) past 14 characters, the old
          # pre-Windows-2000 LM-compat limit; keep this at or under it.
          $pw = "Vy" + [guid]::NewGuid().ToString("N").Substring(0, 9) + "!1"
          net user vyreacltest "$pw" /add
          try {
            $sec = ConvertTo-SecureString $pw -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential("vyreacltest", $sec)
            $p2 = Start-Process -FilePath node -ArgumentList "scripts/win-connect-probe.mjs `"$sockPath`"" `
              -Credential $cred -NoNewWindow -PassThru -Wait -WorkingDirectory "$PWD" `
              -RedirectStandardOutput "$env:RUNNER_TEMP\probe.out" -RedirectStandardError "$env:RUNNER_TEMP\probe.err"
            Get-Content "$env:RUNNER_TEMP\probe.out","$env:RUNNER_TEMP\probe.err" -ErrorAction SilentlyContinue
            if ($p2.ExitCode -eq 0) { throw "a second local user connected to vyred's socket; it is not private" }
          } finally {
            net user vyreacltest /delete
          }
      - name: Stop vyred
        if: always()
        shell: pwsh
        run: |
          $p = "${{ steps.start.outputs.pid }}"
          if ($p) { Stop-Process -Id $p -Force -ErrorAction SilentlyContinue }
