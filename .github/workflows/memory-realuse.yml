# The real-use memory test (scripts/eval-realuse.mjs): the same questions asked of no memory, a simulated Claude auto memory, Vyre
# Memory and the full context, over a scrubbed corpus of Vyre's own sessions, through OpenRouter on one cheap model. Manual only, in the
# protected environment `eval` (a required reviewer approves each dispatch), on the test box's own runner so the corpus never leaves the test box:
# it is read from REALUSE_DIR (owned by the runner's user, mode 700), nothing of it is uploaded (the artifact is the results table and a
# list of session ids, dates and sizes), and the job removes the corpus, the questions, the replies and the ledger when a run ends.
# The test's hard cap is $5 (REALUSE_CAP_USD, a ledger in the folder and the key's own usage before and after; the key is never printed).
# `step: gen` writes the questions and keeps the folder so they can be read on the test box before `step: run`; the run uses the cap left after gen.
name: memory-realuse
on:
  workflow_dispatch:
    inputs:
      step:
        description: gen (write the questions), run (the four arms, then wipe the folder) or both
        type: choice
        options: [both, gen, run]
        default: both
      cap_usd:
        description: the test's cap in USD (use 4.8 for a run after a gen, which already spent about 0.1)
        default: "5"
permissions:
  contents: read
concurrency:
  group: memory-realuse
  cancel-in-progress: false
env:
  REALUSE_DIR: /srv/vyre-test/eval-realuse
  VYRE_NO_DIALOGS: "1"
jobs:
  realuse:
    runs-on: [self-hosted, linux-heavy]
    environment: eval
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - name: The corpus is where it should be
        run: |
          test -f "$REALUSE_DIR/corpus.json" || { echo "no corpus at the fixed path"; exit 1; }
          node -e 'const c=require(process.env.REALUSE_DIR+"/corpus.json");console.log(c.sessions.length+" sessions, "+c.sessions.reduce((n,s)=>n+s.turns.reduce((m,t)=>m+t.text.length,0),0)+" characters")'
      - name: Estimate, with no key
        run: node scripts/eval-realuse.mjs "$REALUSE_DIR" --estimate
      - name: Questions
        if: inputs.step != 'run'
        env:
          OPENROUTER_EVAL_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
          REALUSE_CAP_USD: ${{ inputs.cap_usd }}
        run: node scripts/eval-realuse.mjs "$REALUSE_DIR" --gen
      - name: The four arms
        id: arms
        if: inputs.step != 'gen'
        env:
          OPENROUTER_EVAL_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
          REALUSE_CAP_USD: ${{ inputs.cap_usd }}
        run: node scripts/eval-realuse.mjs "$REALUSE_DIR" --run
        continue-on-error: true
      - name: The results table and the session list, and nothing else
        if: inputs.step != 'gen'
        run: |
          mkdir -p out
          node scripts/eval-realuse.mjs "$REALUSE_DIR" --report > out/table.txt || echo "no results (the run stopped before it finished)" > out/table.txt
          node -e 'const c=require(process.env.REALUSE_DIR+"/corpus.json");console.log(c.sessions.map(s=>s.id.slice(0,14)+"  "+new Date(s.start).toISOString().slice(0,10)+"  "+s.turns.reduce((n,t)=>n+t.text.length,0)+" chars").join("\n"))' > out/sessions.txt
          { echo '### memory-realuse'; echo '```'; cat out/table.txt; echo '```'; echo "Sessions used: $(wc -l < out/sessions.txt)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.step != 'gen'
        with:
          name: realuse-table
          path: |
            out/table.txt
            out/sessions.txt
          if-no-files-found: warn
      - name: Wipe the corpus, the questions, the replies and the ledger
        if: always() && inputs.step != 'gen'
        run: |
          rm -f "$REALUSE_DIR"/corpus.json "$REALUSE_DIR"/questions.json "$REALUSE_DIR"/replies.json "$REALUSE_DIR"/spend.json "$REALUSE_DIR"/results.json "$REALUSE_DIR"/real-world.json "$REALUSE_DIR"/real-asks.json
          ls -A "$REALUSE_DIR" | wc -l | sed 's/^/files left in the folder: /'
      - name: Fail when the arms did not finish
        if: steps.arms.outcome == 'failure'
        run: exit 1
