# The wall that keeps a watcher off the network, out of the person's home and away from other
# processes, against the real product (a real vyred, no test hook): raw sockets to loopback, a
# tailnet-range address and the internet, vyred's own unix socket by path, a signal to vyred, and the
# home directory are all refused, and the scripted refusals hold (core/watchers/isolation.test.js;
# plan IM1 and done-check 8). The Linux cases walk Ubuntu's user-namespace restriction:
#   linux-nobwrap       no bubblewrap: no wall, and the refusal says to install it
#   linux-restricted    bubblewrap, restriction on, no profile: no wall, and the refusal names the fix
#   linux-profile       the installer's own wallSteps() (its AppArmor profile): the bwrap wall
#   macos               sandbox-exec
name: watchers-isolation
on:
  workflow_dispatch:
  push:
    branches: ["work/watchers"]
    paths: ["core/watchers/**", "lib/sandbox/**", ".github/workflows/watchers-isolation.yml"]
permissions:
  contents: read
jobs:
  wall:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-nobwrap, os: ubuntu-latest, mode: nobwrap, expect: none, hint: "install bubblewrap" }
          - { name: linux-restricted, os: ubuntu-latest, mode: restricted, expect: "", hint: "" }
          - { name: linux-profile, os: ubuntu-latest, mode: profile, expect: bwrap, hint: "" }
          - { name: macos, os: macos-latest, mode: mac, expect: sandbox-exec, hint: "" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: no bubblewrap
        if: matrix.mode == 'nobwrap'
        run: sudo apt-get remove -y bubblewrap || true
      - name: bubblewrap, with the restriction on and no profile
        if: matrix.mode == 'restricted' || matrix.mode == 'profile'
        run: |
          sudo apt-get install -y bubblewrap apparmor-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo rm -f /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/vyre-bwrap
          sudo aa-remove-unknown || true
      - name: the installer's wall steps (what vyre up --system runs as root)
        if: matrix.mode == 'profile'
        run: |
          cat > /tmp/wall-install.mjs <<'JS'
          import { wallSteps } from "/home/runner/work/vyre/vyre/lib/sandbox/index.js";
          import * as s from "/home/runner/work/vyre/vyre/core/names/system.js";
          const steps = wallSteps();
          console.log(JSON.stringify(steps.map(x => x.do + " " + (x.path || (x.argv || []).join(" ")))));
          if (!steps.some(x => x.do === "write")) throw new Error("the installer wrote no profile");
          await s.apply(steps, { out: console.log });
          JS
          sed -i "s#/home/runner/work/vyre/vyre#$GITHUB_WORKSPACE#g" /tmp/wall-install.mjs
          sudo env "PATH=$PATH" node /tmp/wall-install.mjs
      - name: a loopback alias in the tailnet range
        if: runner.os == 'Linux'
        run: sudo ip addr add 100.100.100.100/32 dev lo
      - run: npm ci --omit=dev || npm install --omit=dev --no-audit --no-fund
      - name: the wall, as an ordinary user
        env:
          VYRE_WALL_CHECK: "1"
          VYRE_EXPECT_WALL: ${{ matrix.expect }}
          VYRE_EXPECT_HINT: ${{ matrix.hint }}
          VYRE_TEST_TAILNET_ADDR: ${{ runner.os == 'Linux' && '100.100.100.100' || '' }}
        run: node --test --test-reporter=spec core/watchers/isolation.test.js
      - name: uninstall removes the profile
        if: matrix.mode == 'profile'
        run: |
          cat > /tmp/wall-uninstall.mjs <<'JS'
          import { wallUninstallSteps } from "WS/lib/sandbox/index.js";
          import * as s from "WS/core/names/system.js";
          await s.apply(wallUninstallSteps(), { out: console.log });
          JS
          sed -i "s#WS#$GITHUB_WORKSPACE#g" /tmp/wall-uninstall.mjs
          sudo env "PATH=$PATH" node /tmp/wall-uninstall.mjs
          test ! -e /etc/apparmor.d/vyre-bwrap
