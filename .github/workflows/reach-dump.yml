# Temporary (vault, reach sweep): the booted reach checks and the suites the sweep touches, on a throwaway runner.
name: reach-dump
on:
  workflow_dispatch:
  push:
    branches: ["work/vault-reach"]
permissions:
  contents: read
jobs:
  reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Dump as the test runs it
        run: |
          env -i PATH="$PATH" VYRE_NO_DIALOGS=1 node scripts/reach-dump.mjs > d.json 2>d.err; echo rc=$?; head -c 600 d.err; node -e 'const s=require("fs").readFileSync("d.json","utf8");try{JSON.parse(s);console.log("json ok",s.length)}catch(e){console.log(e.message);console.log(JSON.stringify(s.slice(146100,146300)))}'
      - name: Reach suite and the touched module suites
        run: |
          set +e; rc=0
          for f in core/vault/module-delete.test.js test/reach-*.test.js core/vault/reach.test.js core/vault/surfaces.test.js core/vyre-core/forward.test.js core/gate/module.test.js core/google/module.test.js core/mail/module.test.js core/vault/agent-grants.test.js core/vault/tools/cli.test.js core/vault/kit.test.js core/vault/module.test.js core/vault/needs.test.js test/redteam/vault.test.js core/modules/modules.test.js core/vault/connections.test.js core/vault/api-request.test.js; do
            VYRE_NO_DIALOGS=1 timeout 600 node --test "$f" >out.log 2>&1 || { echo "FAIL $f"; grep -E -B1 -A22 "^not ok|^    not ok|failureType" out.log | head -90; grep -nE "Error|# fail|not ok" out.log | head -15; tail -25 out.log; rc=1; }
          done
          exit $rc
