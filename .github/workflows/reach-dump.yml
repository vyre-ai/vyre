# Temporary (vault, reach sweep): the booted reach checks and the suites the sweep touches, on a throwaway runner.
name: reach-dump
on:
  workflow_dispatch:
  push:
    branches: ["work/vault-reach"]
permissions:
  contents: read
jobs:
  reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Reach suite and the touched module suites
        run: |
          set +e; rc=0
          for f in test/reach-*.test.js core/vault/reach.test.js core/vault/surfaces.test.js core/vyre-core/forward.test.js core/gate/module.test.js core/google/module.test.js core/mail/module.test.js core/mcp/module.test.js core/connectors/module.test.js core/vault/agent-grants.test.js test/redteam/vault.test.js test/redteam/presence.test.js; do
            VYRE_NO_DIALOGS=1 timeout 600 node --test "$f" >out.log 2>&1 || { echo "FAIL $f"; grep -E "^✖|not ok|AssertionError" out.log | head -8; rc=1; }
          done
          exit $rc
