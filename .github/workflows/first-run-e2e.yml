# The new first run, end to end, on real machines, with NO vyred on the client (scripts/proof-first-run.mjs). A release does not publish unless this passes (release.yml, job first-run).
#
# The client is the app's own first-run screens running the in-page tool host. The app is built from this checkout with two build-time constants that point it at stand-ins on the runner
# (EXPO_PUBLIC_VYRE_NAMES_DIRECTORY and EXPO_PUBLIC_VYRE_RELAY, read at build time only: a shipped app has no setting that can do this). Nothing reaches vyre.run, relay.vyre.run or names.vyre.run.
# Linux runner: headless Chromium walks the proof export; the one install command runs on a server made by the REAL installer (scripts/install-box.sh, in docker).
# macOS runner: the Swift app built here, packaged as a dmg the way a release is, installed from that dmg into /Applications on this empty Mac, and walked with real mouse events into its window
#   (local/capsule/native/Sources/Agent/AgentDrive.swift, a driven mode that starts only in a test home); the server is the REAL Mac installer (scripts/install-mac-server.sh). A hosted runner has no nested
#   virtualization, so that server uses the built-in store (VYRE_PROOF_BUILTIN_STORE), as install-mac-server's own proof does.
name: first-run-e2e
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      owner_walk:
        description: "Also walk the ten owner walks on the fresh box (scripts/lib/proof/owner-walk-real.mjs)"
        type: boolean
        default: false
      strict:
        description: "Fail any owner walk that is still pending (the gate on the final candidate)"
        type: boolean
        default: false
  push:
    # full on main, release/**, integrate/** and the train (no path filter); a pull request or other branch runs it only when its own paths change (the pull_request paths below)
    branches: ["release/**", "integrate/**", "work/**/train"]
  pull_request:
    paths: ["scripts/proof-first-run.mjs", "scripts/lib/proof/**", "scripts/lib/first-run/**", "apps/app/screens/first-run/**", "apps/app/screens/unlock/**", "apps/app/src/shell/**", "apps/app/src/host/**", "local/capsule/native/Sources/**", "core/onboard/**", "core/identity/**", "kernel/identity/**", ".github/workflows/first-run-e2e.yml"]
permissions:
  contents: read
concurrency:
  group: first-run-e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FIRST_RUN_NAMES_PORT: "8787"
  FIRST_RUN_RELAY_PORT: "8788"
jobs:
  linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.owner_walk) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0
      - run: npm ci --no-audit --no-fund
      - name: The runner's address (a server in a container reaches the stand-ins there)
        run: echo "PROOF_HOST_IP=$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Export the web app, pointed at the stand-ins
        working-directory: apps/app
        env:
          EXPO_PUBLIC_VYRE_HOST: "1"
          EXPO_PUBLIC_VYRE_PROOF_YES: "1"
          EXPO_PUBLIC_VYRE_NAMES_DIRECTORY: http://127.0.0.1:${{ env.FIRST_RUN_NAMES_PORT }}
          EXPO_PUBLIC_VYRE_RELAY: ws://${{ env.PROOF_HOST_IP }}:${{ env.FIRST_RUN_RELAY_PORT }}
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx expo export -p web --output-dir "$RUNNER_TEMP/proof-web"
          test -f "$RUNNER_TEMP/proof-web/index.html"
          # positive control: the flagged export shows the marker, so the release export's grep (app.yml) can find it
          grep -rl "vyre-proof-yes-enabled" "$RUNNER_TEMP/proof-web" > /dev/null || { echo "the proof export has no software yes, so the group walk cannot run"; exit 1; }
      - name: A browser (the one pinned version; Chromium 137 or newer, which has Ed25519 in WebCrypto, as the identity chain needs)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: The first run, on a real Linux server
        env:
          PW_FROM: ${{ runner.temp }}/pw/
        run: node scripts/proof-first-run.mjs --client browser --server installer --dist "$RUNNER_TEMP/proof-web" --names-port "$FIRST_RUN_NAMES_PORT" --relay-port "$FIRST_RUN_RELAY_PORT" --out "$RUNNER_TEMP/first-run-linux"
      - name: "The identity in an old browser (no Ed25519 in WebCrypto), carried by the app's own fallback"
        env:
          PW_FROM: ${{ runner.temp }}/pw/
        run: node scripts/proof-first-run.mjs --client browser --server installer --no-ed25519 --dist "$RUNNER_TEMP/proof-web" --names-port "$FIRST_RUN_NAMES_PORT" --relay-port "$FIRST_RUN_RELAY_PORT" --page-port 8790 --out "$RUNNER_TEMP/first-run-linux-old"
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail 120 vyre-vyre-1 2>&1 || true
          tail -60 "$RUNNER_TEMP/first-run-linux/server/install.log" 2>&1 || true
      # Where the minutes go from a Space's start to Records ready (the saved database, the store's phases and definitions, the helper's own log lines).
      - name: Records timing
        if: always()
        run: |
          echo "== vyre container: store phases"
          docker logs vyre-vyre-1 2>&1 | grep -E "phase |definition|record store|saved database|Records starting|Records are available" | grep -v "waiting work after the store joined: 0.0s" | cut -c1-240 | head -80 || true
          echo "== helper log"
          sudo sh -c 'for f in /var/lib/vyre-spaces/private/log /srv/vyre/spaces/private/log; do [ -f "$f" ] && { echo "$f"; tail -60 "$f"; }; done' 2>&1 | cut -c1-240 || true
          echo "== containers"
          docker ps -a --format '{{.Names}} {{.Status}}' | head -40 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: first-run-linux
          path: ${{ runner.temp }}/first-run-linux
          retention-days: 14

  # The owner's walk on a fresh real box, in a real browser (scripts/lib/proof/owner-walk-real.mjs): the release gate of 0.6.2. Only on a dispatch with owner_walk. It runs in the protected environment `eval`
  # Walk 2's real reply needs a model key: the repository's OPENROUTER_EVAL_KEY is held by the protected environment `eval` (branches main and work/stage-0.2 only, a required reviewer), so this job reads it only when
  # the run is allowed that environment; without it the key is empty and walk 2's reply is pending (a failure under strict). The pictures of every walk are the artifact
  # owner-walk-linux (14 days). The log starts with the commit under test (REF and git log -1). Dispatch it for a ref with:
  #   gh workflow run first-run-e2e.yml --ref <branch or tag at the candidate> -f owner_walk=true -f strict=true
  owner-walk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_walk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # the protected environment that holds OPENROUTER_EVAL_KEY (a required reviewer approves each run, and reads the ref's diff of scripts/proof-first-run.mjs and scripts/lib/proof/owner-walk-real.mjs first; the branches that may deploy to it are set in the repository's environment settings)
    environment: eval
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The commit under test
        run: |
          echo "REF: $GITHUB_REF"
          git log -1 --format='%H %an %s'
          echo "strict: ${{ inputs.strict }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0
      - run: npm ci --no-audit --no-fund
      - name: The runner's address (a server in a container reaches the stand-ins there)
        run: echo "PROOF_HOST_IP=$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Export the web app, pointed at the stand-ins
        working-directory: apps/app
        env:
          EXPO_PUBLIC_VYRE_HOST: "1"
          EXPO_PUBLIC_VYRE_PROOF_YES: "1"
          EXPO_PUBLIC_VYRE_NAMES_DIRECTORY: http://127.0.0.1:${{ env.FIRST_RUN_NAMES_PORT }}
          EXPO_PUBLIC_VYRE_RELAY: ws://${{ env.PROOF_HOST_IP }}:${{ env.FIRST_RUN_RELAY_PORT }}
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx expo export -p web --output-dir "$RUNNER_TEMP/proof-web"
          test -f "$RUNNER_TEMP/proof-web/index.html"
          grep -rl "vyre-proof-yes-enabled" "$RUNNER_TEMP/proof-web" > /dev/null || { echo "the proof export has no software yes"; exit 1; }
      - name: A browser (the one pinned version)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: The first run and the ten owner walks, on a real Linux server
        env:
          PW_FROM: ${{ runner.temp }}/pw/
          OWNER_WALK_STRICT: ${{ inputs.strict && '1' || '' }}
          OWNER_WALK_OPENROUTER_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
          OWNER_WALK_MODEL: openai/gpt-4o-mini
        run: node scripts/proof-first-run.mjs --client browser --server installer --owner-walk --dist "$RUNNER_TEMP/proof-web" --names-port "$FIRST_RUN_NAMES_PORT" --relay-port "$FIRST_RUN_RELAY_PORT" --out "$RUNNER_TEMP/owner-walk"
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail 120 vyre-vyre-1 2>&1 || true
          tail -60 "$RUNNER_TEMP/owner-walk/server/install.log" 2>&1 || true
      # The model key never leaves the runner: before anything is uploaded, every file of the run's folder (the pictures too, read as bytes) is searched for the key's value. If one holds it the whole folder is
      # deleted and the job fails, so the owner sees it and nothing is uploaded. The key is in this step's environment only, and an empty key skips the step. The key is typed into the app's password field,
      # which no picture shows, and the walk takes no picture while it is typed.
      - name: Artifact key guard
        id: keyguard
        if: always()
        env:
          OWNER_WALK_OPENROUTER_KEY: ${{ secrets.OPENROUTER_EVAL_KEY }}
        run: |
          set +e
          dir="$RUNNER_TEMP/owner-walk"
          [ -n "${OWNER_WALK_OPENROUTER_KEY:-}" ] || { echo "no model key in this run: nothing to guard"; exit 0; }
          [ -d "$dir" ] || { echo "no artifact folder: nothing to guard"; exit 0; }
          if grep -rlaF -e "$OWNER_WALK_OPENROUTER_KEY" "$dir" >/dev/null 2>&1 || grep -rlaE -e 'sk-or-v1-[A-Za-z0-9]{16,}' "$dir" >/dev/null 2>&1; then
            echo "::error::the model key is in the artifact folder: the folder is deleted and nothing is uploaded"
            rm -rf "$dir"
            exit 1
          fi
          echo "the model key is in none of $(find "$dir" -type f | wc -l) files (pictures read as bytes too)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: owner-walk-linux
          path: ${{ runner.temp }}/owner-walk
          retention-days: 14

  web-mac:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.owner_walk) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: Export the web app, pointed at the stand-ins on the Mac runner's loopback
        working-directory: apps/app
        env:
          EXPO_PUBLIC_VYRE_HOST: "1"
          EXPO_PUBLIC_VYRE_NAMES_DIRECTORY: http://127.0.0.1:${{ env.FIRST_RUN_NAMES_PORT }}
          EXPO_PUBLIC_VYRE_RELAY: ws://127.0.0.1:${{ env.FIRST_RUN_RELAY_PORT }}
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx expo export -p web --output-dir dist
          test -f dist/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-run-web-mac
          path: apps/app/dist
          retention-days: 2

  mac:
    needs: web-mac
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build the Mac app
        run: sh local/capsule/native/build.sh app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: first-run-web-mac
          path: ${{ runner.temp }}/web
      - name: Package it as the release does (a dmg), then install it from the dmg onto this empty Mac
        env:
          VYRE_APP_WEB_DIR: ${{ runner.temp }}/web
        run: |
          set -eu
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          sh scripts/mac-app-package.sh "$version" aarch64 local/capsule/native/.build/Vyre.app "$RUNNER_TEMP/dist-mac"
          mnt="$(mktemp -d)"
          hdiutil attach "$RUNNER_TEMP/dist-mac/Vyre-${version}-aarch64.dmg" -nobrowse -mountpoint "$mnt" >/dev/null
          rm -rf /Applications/Vyre.app
          ditto "$mnt/Vyre.app" /Applications/Vyre.app
          hdiutil detach "$mnt" >/dev/null
          test -f /Applications/Vyre.app/Contents/Resources/app/index.html
          codesign -dv /Applications/Vyre.app 2>&1 | grep -E "Identifier|Signature" || true
      - name: The first run, in the installed Mac app with no vyred, on a real Mac server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/first-run-mac"
          node scripts/proof-first-run.mjs --client mac-app --server mac --app /Applications/Vyre.app --names-port "$FIRST_RUN_NAMES_PORT" --relay-port "$FIRST_RUN_RELAY_PORT" --out "$RUNNER_TEMP/first-run-mac" | tee "$RUNNER_TEMP/first-run-mac/walk.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: first-run-mac
          path: ${{ runner.temp }}/first-run-mac
          if-no-files-found: warn
          retention-days: 14
