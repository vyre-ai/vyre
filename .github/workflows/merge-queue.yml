# The merge queue (team/FOUNDATION.md, part 7): a teammate pushes a finished branch to
# work/q/<team>/<item> (scripts/team/queue.sh). Each run lands EVERY waiting queue branch, oldest
# first, through scripts/team/land-queue.sh: merge into the integration branch, preflight the
# merged tree, regenerate the generated files, push. GitHub keeps only the newest pending run of a
# concurrency group, so a skipped run loses nothing: the next one finds the branch still waiting.
# The full suite then runs once on the new tip (node.yml).
name: merge-queue
on:
  push:
    branches: ["work/q/**"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: merge-queue
  cancel-in-progress: false
env:
  TARGET: work/lead-031-w
  VYRE_NO_DIALOGS: "1"
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y bubblewrap && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true)
      - run: npm ci --no-audit --no-fund
      # The real-browser tests (a published React page drawn in headless Chrome) run everywhere they are counted: the one pinned chrome-headless-shell, hash-checked, cached by its pin (scripts/install-test-chrome.mjs).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vyre/chrome-headless-shell
          key: chrome-headless-shell-153.0.8010.12
      - run: node scripts/install-test-chrome.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/app
      - name: Land every waiting queue branch
        run: bash scripts/team/land-queue.sh
        env:
          GH_TOKEN: ${{ github.token }}
