# The headless Linux runtime "On this Mac" installs for Twenty and agents' computers: Apple's `container` (macOS 26, Apple silicon) with Colima as the fallback
# (scripts/install-mac-server.sh). Hosted macOS runners cannot run a virtual machine, so this proves the parts that do not need one: the pinned package's checksum
# and Apple signature, its layout once unpacked into a user folder (no root), that the CLI starts and names the flags the installer uses, and the installer's
# own tests with fakes. Starting a container for real is a device walk on a Mac, never here.
name: mac-runtime
on:
  workflow_dispatch:
  push:
    branches: ["work/launch*", "work/mac-*"]
    paths: ["scripts/install-mac-server.sh", "test/install-mac-server.test.js", ".github/workflows/mac-runtime.yml"]
permissions:
  contents: read
concurrency:
  group: mac-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-pkg:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The runner
        run: sw_vers; uname -m
      - name: Probe the pinned Apple container package (download, checksum, signature, layout)
        run: |
          set -eu
          v=1.5.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/container.pkg" "https://github.com/apple/container/releases/download/$v/container-$v-installer-signed.pkg"
          shasum -a 256 "$RUNNER_TEMP/container.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/container.pkg" || true
          pkgutil --payload-files "$RUNNER_TEMP/container.pkg" | head -60 || true
          pkgutil --expand-full "$RUNNER_TEMP/container.pkg" "$RUNNER_TEMP/expanded"
          find "$RUNNER_TEMP/expanded" -maxdepth 4 | head -60
      - name: The CLI starts from a user folder and names its flags
        run: |
          set -eu
          p=$(find "$RUNNER_TEMP/expanded" -type f -path '*bin/container' | head -1)
          echo "cli: $p"; file "$p"
          "$p" --version || true
          "$p" system start --help || true
          "$p" system --help || true
