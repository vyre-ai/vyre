name: runner-chaos
# The lent computer under attack (R031-95): kill -9, sleep, network drops, lease expiry and clock skew against a real runner (sandbox and encrypted workspace) and a real home, on hosted Linux and hosted macOS.
# scripts/runner-chaos.mjs asserts no turn is lost or repeated, the server resumes from the last whole turn, a computer that woke up writes nothing, and a workspace is closed before "locked". Never on a person's Mac.
# Runs on a push to work/runner-chaos, or by hand. Owner: link.
on:
  workflow_dispatch:
  push:
    branches: [work/runner-chaos]
permissions:
  contents: read
concurrency:
  group: runner-chaos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chaos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VYRE_REQUIRE_SANDBOX: "1"
      VYRE_TEST_HOSTED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bubblewrap, gocryptfs, fuse
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap gocryptfs fuse3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci --no-audit --no-fund
      - name: the chaos suite
        shell: bash
        run: node scripts/runner-chaos.mjs 2>&1 | tee chaos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-chaos-${{ matrix.os }}
          path: chaos.txt
