# Where a session's credential can be read from, measured from inside a real Claude Code session (core/sessions/credential-scan.test.js): the KNOWN state of each way a credential is handed over,
# Vyre's own launch, the home sandbox (bwrap) and THE BAR a picked credential must clear before somebody else may drive a turn on it. The test skips where there is no claude binary, so without this
# job it ran only where nobody looks. A red here is a credential a tool of the session can read: treat it as a leak, never flip an assertion back to make it pass. Fake secrets and a fake Messages API
# only; no account, no key. Never the person's Mac.
name: credential-scan
on:
  push:
    branches: ["work/**", "release/**", "main"]
    paths: ["core/sessions/**", "core/runner/**", "core/agents/**", "scripts/sessions-proof/**", ".github/workflows/credential-scan.yml"]
  pull_request:
    paths: ["core/sessions/**", "core/runner/**", "core/agents/**", "scripts/sessions-proof/**", ".github/workflows/credential-scan.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credential-scan-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # bwrap for the home-sandbox cases; Yama ptrace_scope 1 (Ubuntu's own default, stated so the memory check does not depend on the runner image)
      - run: sudo apt-get install -y bubblewrap && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true) && sudo sysctl -w kernel.yama.ptrace_scope=1
      - run: npm ci
      - name: Install Claude Code into a temp prefix
        run: npm install --prefix "$RUNNER_TEMP/claude" @anthropic-ai/claude-code@2.1.286
      - name: The credential scan (nothing skipped)
        run: |
          set -o pipefail
          export VYRE_CLAUDE_BIN="$RUNNER_TEMP/claude/node_modules/.bin/claude"
          node --test --test-reporter=spec core/sessions/credential-scan.test.js 2>&1 | tee scan.log
          # a skipped case proves nothing: every case must have run here
          if grep -E "(skipped|todo) [1-9]" scan.log; then echo "a case was skipped or left todo"; exit 1; fi
