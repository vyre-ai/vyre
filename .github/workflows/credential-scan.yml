# The proof that a session's tools cannot read its credential (core/sessions/credential-scan.test.js): the REAL claude binary, the fake Messages API, fake secrets, one Bash call that looks at the environment, /proc/<pid>/environ and
# cmdline, the readable file descriptors, the process memory and the config folder, for every way a credential is handed over (the key on file descriptor 3, a setup token, a member's lent key). The node suite does not install the claude
# binary, so there that test skips; this job installs the SAME version the computer image pins (core/computers/image/Dockerfile) and runs only the credential-scan tests, and fails if any of them skips or none runs.
# No secret and no login: the test only spawns the binary against a fake API on loopback, with fake secrets.
# A variant of the test for a lent key belongs in core/sessions/credential-scan*.test.js to be run here too.
name: credential-scan
on:
  push:
    branches: ["main", "release/**", "integrate/**", "work/**/train"]
  pull_request:
    paths:
      - "core/sessions/**"
      - "scripts/sessions-proof/**"
      - "core/computers/image/Dockerfile"
      - "test/helpers.js"
      - "test/scratch.mjs"
      - ".github/workflows/credential-scan.yml"
  workflow_dispatch:
  # release.yml may call this beside the other checks
  workflow_call:
permissions:
  contents: read
concurrency:
  group: credential-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # bubblewrap for the sandboxed-agent case, as the node suite has it; Ubuntu 24.04 restricts unprivileged user namespaces for it
      - run: |
          command -v bwrap >/dev/null || { sudo apt-get -o DPkg::Lock::Timeout=300 update -qq && sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci --no-audit --no-fund
      - name: Install the pinned Claude Code, the version the computer image pins
        run: |
          set -eu
          v=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=\([0-9][0-9.]*\)$/\1/p' core/computers/image/Dockerfile | head -1)
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::the computer image names no pinned Claude Code version"; exit 1; }
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/claude" "@anthropic-ai/claude-code@$v"
          bin="$RUNNER_TEMP/claude/node_modules/.bin/claude"
          [ -x "$bin" ] || { echo "::error::no claude binary after the install"; exit 1; }
          got=$("$bin" --version | head -1)
          echo "claude $got (pinned $v)" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$got" in "$v"*) ;; *) echo "::error::installed $got, pinned $v"; exit 1;; esac
          echo "VYRE_CLAUDE_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run the credential-scan tests, and fail if one skips or none runs
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=spec core/sessions/credential-scan*.test.js 2>&1 | tee "$RUNNER_TEMP/scan.log"
          grep -Eq '^ℹ skipped 0$' "$RUNNER_TEMP/scan.log" || { echo "::error::a credential-scan test skipped: the proof did not run"; grep -E '^ℹ (tests|pass|fail|skipped)' "$RUNNER_TEMP/scan.log"; exit 1; }
          grep -Eq '^ℹ pass [1-9]' "$RUNNER_TEMP/scan.log" || { echo "::error::no credential-scan test passed"; exit 1; }
          grep -E '^ℹ (tests|pass|fail|skipped)' "$RUNNER_TEMP/scan.log" | tee -a "$GITHUB_STEP_SUMMARY"
