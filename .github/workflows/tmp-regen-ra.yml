# Temporary: runs scripts/team/regen.mjs on Linux and uploads the patch, because a person may not run the generators on a Mac. Removed in the next commit.
name: tmp-regen-ra
on:
  push:
    branches: ["work/0.6.4/lead/records-access"]
    paths: [".github/workflows/tmp-regen-ra.yml"]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/team/regen.mjs
      - run: |
          git checkout -- kernel/golden 2>/dev/null || true
          git add -A -- docs/index.json docs/reference docs/agents docs/architecture/map.md
          git status --porcelain
          git diff --cached --binary > "$RUNNER_TEMP/regen.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen.patch
