# vyre.run follows the release (#16). When a stable release is published, this assembles the site from main's pages plus that tag's signed
# files (scripts/assemble-site.sh) and deploys it to Cloudflare Pages, after the `deploy` environment's reviewer approves, then checks the
# deployed copy byte for byte (--check). It runs from main, because the `deploy` environment only accepts main and work/stage-0.2, and a
# tag run cannot use it. A prerelease or a dry run does nothing here. To redo one by hand: dispatch it on main with the tag.
#
#   gh workflow run site-deploy.yml --ref main -f tag=v0.2.2
name: site-deploy
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The stable release tag to put on vyre.run (vX.Y.Z)"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: site-deploy
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
jobs:
  assemble:
    name: assemble (no credentials, nothing is changed)
    # a release run that succeeded for a tag; a dry run on a branch or a prerelease is skipped below
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      go: ${{ steps.is.outputs.go }}
    steps:
      - name: this runs from main only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::run this from main, not $REF"; exit 1; }
      - id: is
        name: a published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf %s "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "$TAG is not a stable tag; nothing to deploy"; echo "go=no" >>"$GITHUB_OUTPUT"; exit 0; }
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft -q '"\(.isPrerelease) \(.isDraft)"' 2>/dev/null || echo missing)
          [ "$pre" = "false false" ] || { echo "$TAG is not a published stable release ($pre); nothing to deploy"; echo "go=no" >>"$GITHUB_OUTPUT"; exit 0; }
          echo "go=yes" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.is.outputs.go == 'yes'
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.is.outputs.go == 'yes'
        with:
          node-version: 22
      - name: assemble the site from main's pages and the tag's signed files
        if: steps.is.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          npm ci --ignore-scripts --no-audit --no-fund
          scripts/assemble-site.sh --out "$RUNNER_TEMP/site" --tag "$TAG"
  deploy:
    name: deploy (waits for the deploy environment's reviewer)
    needs: assemble
    if: ${{ needs.assemble.outputs.go == 'yes' }}
    runs-on: ubuntu-24.04
    environment: deploy
    timeout-minutes: 20
    steps:
      - name: this runs from main only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::run this from main, not $REF"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: assemble the site again, the same way
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          npm ci --ignore-scripts --no-audit --no-fund
          scripts/assemble-site.sh --out "$RUNNER_TEMP/site" --tag "$TAG"
      - name: deploy to vyre.run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::the deploy environment has no Cloudflare token or account id"; exit 1; }
          scripts/deploy-site.sh "$RUNNER_TEMP/site" --branch main
      - name: the served copy is the assembled copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            scripts/assemble-site.sh --out "$RUNNER_TEMP/site-check" --tag "$TAG" --check https://vyre.run >"$RUNNER_TEMP/check.txt" 2>&1 && { tail -3 "$RUNNER_TEMP/check.txt"; exit 0; }
            sleep 20
          done
          cat "$RUNNER_TEMP/check.txt"; exit 1
