# The real-device rehearsal matrix (e2e2, docs/work/e2e2.md). Every target is a fresh hosted
# runner: nothing here ever reaches the user's server or Mac. Dispatch it for a branch:
#   gh workflow run matrix.yml --ref work/<team> -f journeys=J0 -f on=all
name: matrix
# Runs when dispatched or on a release-candidate branch (work/rc-*), not on every work push: each run takes
# the shared hosted and Mac/Windows runners for a long time.
on:
  workflow_dispatch:
    inputs:
      journeys: { description: "Journeys to run (J0 for now)", default: "J0" }
      on: { description: "Targets: all, or a comma list of linux,arm64,android,windows,mac,ios", default: "all" }
  push:
    branches: ["work/rc-*"]
permissions:
  contents: read
concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
env:
  WANT: ${{ github.event.inputs.on || 'all' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The box files, as vyre.run serves them
        run: sh scripts/build-site.sh
      - uses: actions/upload-artifact@v4
        with: { name: box, path: site/box, retention-days: 7 }

  rc-smoke:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'linux') || contains(github.event.inputs.on, 'arm64')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: rc-smoke, the release smoke on a throwaway box in Docker
        run: sh scripts/rc-smoke.sh box/vyre.tgz </dev/null

  linux:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: Why the install failed (diagnostics)
        if: failure()
        run: |
          docker version --format 'engine {{.Server.Version}}'; docker compose version
          cd /srv/vyre && cat .env && docker compose config --images; docker compose config | sed -n '/^  vyre:/,/^  [a-z]/p' | head -30
          docker images; docker compose ps -a
          docker compose up -d 2>&1 | tail -20
      - name: J0 in desktop Chrome
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" --no-first-run about:blank >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:9222/json/version >/dev/null && break; sleep 0.2; done
          node scripts/matrix/j0.mjs --link-file link.txt --device linux-chrome --out results/linux; rc=$?
          sh scripts/matrix/new-link.sh link2.txt
          node scripts/matrix/j0.mjs --link-file link2.txt --device linux-chrome-390 --out results/linux --mobile || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-linux, path: results, retention-days: 14 }

  android:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: J0 in Chrome on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: sh scripts/matrix/android-j0.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-android, path: results, retention-days: 14 }

  windows:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: J0 in Chrome on Windows 11 (installs Windows first, about 15 minutes)
        run: sh scripts/matrix/windows-j0.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-windows, path: results, retention-days: 14 }

  # The Mac and the iPhone simulator can't run the box (no Docker on hosted macOS), so the box runs
  # on a Linux runner behind a throwaway tunnel that hands it Host 127.0.0.1:7300. The two jobs
  # meet through a run artifact (spike E2: about 20 s). The artifact holds the tunnel's address
  # and one-time links to a throwaway box; it is deleted as soon as the Mac is done.
  mac-box:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'mac') || contains(github.event.inputs.on, 'ios')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: A throwaway tunnel and one link per Mac device
        run: |
          curl -fsSLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x cloudflared
          (./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:7300 --http-host-header 127.0.0.1:7300 > cf.log 2>&1 &)
          for i in $(seq 1 60); do URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1); [ -n "$URL" ] && break; sleep 1; done
          mkdir rv; echo "$URL" > rv/url
          # Each new link replaces the last, so the Mac asks for its links one at a time, through a second tunnel.
          SECRET=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'); echo "$SECRET" > rv/secret
          (python3 scripts/matrix/link-server.py 18091 "$SECRET" &)
          (./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:18091 > cf2.log 2>&1 &)
          for i in $(seq 1 60); do LURL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf2.log | head -1); [ -n "$LURL" ] && break; sleep 1; done
          echo "$LURL" > rv/linkurl
      - uses: actions/upload-artifact@v4
        with: { name: mac-rv, path: rv, retention-days: 1 }
      - name: Hold the box until the Mac is done, then delete the links
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          for i in $(seq 1 200); do gh api "$api" --jq '.artifacts[].name' | grep -qx mac-done && break; sleep 10; done
          id=$(gh api "$api" --jq '.artifacts[] | select(.name=="mac-rv") | .id'); [ -z "$id" ] || gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"

  mac:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'mac') || contains(github.event.inputs.on, 'ios')
    runs-on: macos-15
    timeout-minutes: 45
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Meet the box (its tunnel and links)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          for i in $(seq 1 120); do id=$(gh api "$api" --jq '.artifacts[] | select(.name=="mac-rv") | .id'); [ -n "$id" ] && break; sleep 10; done
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > rv.zip && mkdir -p "$RUNNER_TEMP/rv" && unzip -o -q rv.zip -d "$RUNNER_TEMP/rv" && rm rv.zip
          (node scripts/matrix/mac-proxy.mjs "$(cat "$RUNNER_TEMP/rv/url")" > "$RUNNER_TEMP/proxy.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:7300/ -w '%{http_code}' 2>/dev/null | grep -q . && break; sleep 1; done
      - name: J0 in Chrome on the Mac
        run: |
          sh scripts/matrix/fetch-link.sh "$RUNNER_TEMP/rv" mac-chrome
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" --no-first-run about:blank >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:9222/json/version >/dev/null && break; sleep 0.2; done
          node scripts/matrix/j0.mjs --link-file "$RUNNER_TEMP/rv/mac-chrome" --device mac-chrome --out results/mac
      - name: J0 in Safari on the Mac
        if: always()
        run: |
          sh scripts/matrix/fetch-link.sh "$RUNNER_TEMP/rv" mac-safari
          sudo safaridriver --enable
          safaridriver -p 4444 >/dev/null 2>&1 &
          sleep 2
          node scripts/matrix/j0.mjs --webdriver http://127.0.0.1:4444 --link-file "$RUNNER_TEMP/rv/mac-safari" --device mac-safari --out results/mac
      - name: J0 in Safari on the iPhone simulator
        if: always()
        run: |
          sh scripts/matrix/fetch-link.sh "$RUNNER_TEMP/rv" ios-safari
          sh scripts/matrix/ios-j0.sh "$RUNNER_TEMP/rv/ios-safari"
      - name: Tell the box it can go
        if: always()
        run: mkdir -p done && date > done/at
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-done, path: done, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-mac, path: results, retention-days: 14 }

  upgrade:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'upgrade')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The candidate, one version above 0.1.1 so an update has somewhere to go
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version="0.2.0-e2e.1";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          sh scripts/build-site.sh
      - name: The v0.1.1 release files
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v0.1.1 --repo vyre-ai/vyre --dir old
      - name: J2, the upgrade from 0.1.1 to this build
        run: bash scripts/matrix/j2-upgrade.sh old site/box results/upgrade
      - name: Diagnostics
        if: failure()
        run: cat results/upgrade/install.log 2>/dev/null | tail -30; docker ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-upgrade, path: results, retention-days: 14 }

  data:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'data')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: J8, export, import and uninstall
        run: bash scripts/matrix/j8-data.sh box results/data
      - name: Diagnostics
        if: failure()
        run: for f in results/data/*.log; do echo "== $f"; tail -15 "$f"; done; docker ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-data, path: results, retention-days: 14 }

  j1:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'j1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: sh scripts/build-site.sh
      - name: J1, install and onboarding through the setup page
        run: sh scripts/matrix/j1.sh results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-j1, path: results, retention-days: 14 }

  j6:
    name: j6-${{ matrix.os }}
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'j6')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: J6, Vyre for Chrome on a fake GoHighLevel page
        run: node scripts/matrix/j6.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-j6-${{ matrix.os }}", path: results, retention-days: 14 }

  j7:
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'j7')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: J7, an agent's computer in Glass (known red until the computers bugs are fixed)
        run: node scripts/matrix/j7.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-j7, path: results, retention-days: 14 }

  refusals:
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'refusals')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The candidate, one version above 0.1.1
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version="0.2.0-e2e.1";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          sh scripts/build-site.sh
      - name: J2b, the signed-update refusals on a real install
        run: bash scripts/matrix/j2-update-refusals.sh site/box results/update-refusals
      - name: Diagnostics
        if: failure()
        run: tail -30 results/update-refusals/install.log results/update-refusals/updater.log 2>/dev/null; docker ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-update-refusals, path: results, retention-days: 14 }

  j1b:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'j1b')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: sh scripts/build-site.sh
      - name: J1b, naming the box from a terminal
        run: sh scripts/matrix/j1b-cli.sh results/j1b
      - name: Diagnostics
        if: failure()
        run: tail -20 results/j1b/install.log; for f in results/j1b/*.log results/j1b/*.err; do echo "== $f"; head -c 500 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-j1b, path: results, retention-days: 14 }

  j5:
    name: j5-${{ matrix.os }}
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'j5')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: J5, the pairing steps an agent can walk (5.1, 5.6, 5.9)
        run: node scripts/matrix/j5.mjs results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-j5-${{ matrix.os }}", path: results, retention-days: 14 }

  cosign:
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'cosign')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The candidate, with the unstripped wrapper the cosign cases need
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version="0.2.0-e2e.1";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          VYRE_TEST_UNSTRIPPED_WRAPPER=1 sh scripts/build-site.sh
      - name: J2c, the cosign refusals
        run: bash scripts/matrix/j2c-cosign-refusals.sh site/box results/cosign-refusals
      - name: Diagnostics
        if: failure()
        run: tail -30 results/cosign-refusals/install.log results/cosign-refusals/sign-*.log 2>/dev/null; docker ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-cosign-refusals, path: results, retention-days: 14 }

  report:
    needs: [j5, cosign, j1b, linux, android, windows, mac, upgrade, data, j1, j6, j7, refusals]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: results, merge-multiple: true }
      - name: The results page
        run: node scripts/matrix/report.mjs results --sha "${{ github.sha }}" --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: matrix-results, path: results, retention-days: 30 }
