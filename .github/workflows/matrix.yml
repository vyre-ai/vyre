# The real-device rehearsal matrix (e2e2, docs/work/e2e2.md). Every target is a fresh hosted
# runner: nothing here ever reaches the user's server or Mac. Dispatch it for a branch:
#   gh workflow run matrix.yml --ref work/<team> -f journeys=J0 -f on=all
name: matrix
on:
  workflow_dispatch:
    inputs:
      journeys: { description: "Journeys to run (J0 for now)", default: "J0" }
      on: { description: "Targets: all, or a comma list of linux,arm64,android,windows,mac,ios", default: "all" }
  push:
    branches: ["work/e2e2"]
permissions:
  contents: read
concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: false
env:
  WANT: ${{ github.event.inputs.on || 'all' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The box files, as vyre.run serves them
        run: sh scripts/build-site.sh
      - uses: actions/upload-artifact@v4
        with: { name: box, path: site/box, retention-days: 7 }

  rc-smoke:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'linux') || contains(github.event.inputs.on, 'arm64')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: rc-smoke, the release smoke on a throwaway box in Docker
        run: sh scripts/rc-smoke.sh box/vyre.tgz </dev/null

  linux:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: Why the install failed (diagnostics)
        if: failure()
        run: |
          docker version --format 'engine {{.Server.Version}}'; docker compose version
          cd /srv/vyre && cat .env && docker compose config --images; docker compose config | sed -n '/^  vyre:/,/^  [a-z]/p' | head -30
          docker images; docker compose ps -a
          docker compose up -d 2>&1 | tail -20
      - name: J0 in desktop Chrome
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" --no-first-run about:blank >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:9222/json/version >/dev/null && break; sleep 0.2; done
          node scripts/matrix/j0.mjs --link-file link.txt --device linux-chrome --out results/linux; rc=$?
          sh scripts/matrix/new-link.sh link2.txt
          node scripts/matrix/j0.mjs --link-file link2.txt --device linux-chrome-390 --out results/linux --mobile || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-linux, path: results, retention-days: 14 }

  android:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: J0 in Chrome on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: sh scripts/matrix/android-j0.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-android, path: results, retention-days: 14 }

  windows:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: J0 in Chrome on Windows 11 (installs Windows first, about 15 minutes)
        run: sh scripts/matrix/windows-j0.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-windows, path: results, retention-days: 14 }

  # The Mac and the iPhone simulator can't run the box (no Docker on hosted macOS), so the box runs
  # on a Linux runner behind a throwaway tunnel that hands it Host 127.0.0.1:7300. The two jobs
  # meet through a run artifact (spike E2: about 20 s). The artifact holds the tunnel's address
  # and one-time links to a throwaway box; it is deleted as soon as the Mac is done.
  mac-box:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'mac') || contains(github.event.inputs.on, 'ios')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: Install a box with the real installer
        run: sh scripts/matrix/box-up.sh box link.txt
      - name: A throwaway tunnel and one link per Mac device
        run: |
          curl -fsSLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x cloudflared
          (./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:7300 --http-host-header 127.0.0.1:7300 > cf.log 2>&1 &)
          for i in $(seq 1 60); do URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1); [ -n "$URL" ] && break; sleep 1; done
          mkdir rv; echo "$URL" > rv/url
          for d in mac-chrome mac-safari ios-safari; do sh scripts/matrix/new-link.sh "rv/$d"; done
      - uses: actions/upload-artifact@v4
        with: { name: mac-rv, path: rv, retention-days: 1 }
      - name: Hold the box until the Mac is done, then delete the links
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          for i in $(seq 1 200); do gh api "$api" --jq '.artifacts[].name' | grep -qx mac-done && break; sleep 10; done
          id=$(gh api "$api" --jq '.artifacts[] | select(.name=="mac-rv") | .id'); [ -z "$id" ] || gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"

  mac:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'mac') || contains(github.event.inputs.on, 'ios')
    runs-on: macos-15
    timeout-minutes: 45
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Meet the box (its tunnel and links)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          for i in $(seq 1 120); do id=$(gh api "$api" --jq '.artifacts[] | select(.name=="mac-rv") | .id'); [ -n "$id" ] && break; sleep 10; done
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > rv.zip && mkdir -p "$RUNNER_TEMP/rv" && unzip -o -q rv.zip -d "$RUNNER_TEMP/rv" && rm rv.zip
          (node scripts/matrix/mac-proxy.mjs "$(cat "$RUNNER_TEMP/rv/url")" > "$RUNNER_TEMP/proxy.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:7300/ -w '%{http_code}' 2>/dev/null | grep -q . && break; sleep 1; done
      - name: J0 in Chrome on the Mac
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" --no-first-run about:blank >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:9222/json/version >/dev/null && break; sleep 0.2; done
          node scripts/matrix/j0.mjs --link-file "$RUNNER_TEMP/rv/mac-chrome" --device mac-chrome --out results/mac
      - name: J0 in Safari on the Mac
        if: always()
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 >/dev/null 2>&1 &
          sleep 2
          node scripts/matrix/j0.mjs --webdriver http://127.0.0.1:4444 --link-file "$RUNNER_TEMP/rv/mac-safari" --device mac-safari --out results/mac
      - name: J0 in Safari on the iPhone simulator
        if: always()
        run: sh scripts/matrix/ios-j0.sh "$RUNNER_TEMP/rv/ios-safari"
      - name: Tell the box it can go
        if: always()
        run: mkdir -p done && date > done/at
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-done, path: done, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-mac, path: results, retention-days: 14 }

  upgrade:
    needs: build
    if: contains(github.event.inputs.on || 'all', 'all') || contains(github.event.inputs.on, 'upgrade')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: box, path: box }
      - name: The v0.1.1 release files
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v0.1.1 --repo vyre-ai/vyre --dir old
      - name: J2, the upgrade from 0.1.1 to this build
        run: bash scripts/matrix/j2-upgrade.sh old box results/upgrade
      - name: Diagnostics
        if: failure()
        run: cat results/upgrade/install.log 2>/dev/null | tail -30; docker ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-upgrade, path: results, retention-days: 14 }

  report:
    needs: [linux, android, windows, mac, upgrade]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: results, merge-multiple: true }
      - name: The results page
        run: node scripts/matrix/report.mjs results --sha "${{ github.sha }}" --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: matrix-results, path: results, retention-days: 30 }
