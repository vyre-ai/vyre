# The install and pairing walk, end to end (scripts/proof-install.mjs): reserve a name, become yourself in the app, Add a server with the app's install line, the real installer, the four words
# in the app, adopt, a tool call, Add a device, both store choices. The app side is the app's own modules driven headless; the names directory and the relay are local stand-ins
# (nothing reaches vyre.run). One line per step in the log; the run is red when any step fails, and the logs are uploaded either way.
# Jobs: the Linux installer (install-box.sh with docker) and the Mac mini server (install-mac-server.sh on the hosted macOS runner).
name: install-proof
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "update proof: a released tag as the candidate (the control run), empty for this checkout"
        required: false
        default: ""
  push:
    branches: ["work/install-proof", "work/update-proof"]
    paths: ["scripts/proof-install.mjs", "scripts/lib/proof/**", ".github/workflows/install-proof.yml"]
permissions:
  contents: read
concurrency:
  group: install-proof-${{ github.ref }}-${{ inputs.candidate_tag }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: The walk, With and Without Records, on the real installer (from this checkout, signed with a throwaway key)
        run: node scripts/proof-install.mjs --server installer --store both --out proof-out
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail 80 vyre-vyre-1 2>&1 || true
          # why the app did not find or pair the server: the box's own account of its setup session, and the relay lines of its log
          docker exec -u vyre vyre-vyre-1 vyre call relay.setup.status 2>&1 || true
          docker exec -u vyre vyre-vyre-1 sh -c 'grep -h -i "relay\|setup" ~/.vyre/logs/*.log | tail -n 40' 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: install-proof-linux, path: proof-out, retention-days: 14 }

  linux-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      # v0.2.11 (built from its tag the way a release is, signed with a throwaway key) is installed by its own installer; the app pairs with it, then asks for the update through update.apply and the box's own root unit installs this checkout.
      - name: A real update, asked for from the app
        run: node scripts/proof-install.mjs --server installer --update --candidate-tag "${{ inputs.candidate_tag }}" --out proof-out
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail 80 vyre-vyre-1 2>&1 || true
          sudo journalctl -u vyre-update.service --no-pager -n 80 2>&1 || true
          sudo cat /var/lib/vyre-update/status/status.json 2>&1 || true
          tail -60 proof-out/update/server/install.log 2>&1 || true
          tail -80 proof-out/update/server/vyred.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: install-proof-linux-update, path: proof-out, retention-days: 14 }

  mac-server:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      # Without Records only: a Mac server's Records need Colima's VM, which a hosted runner has no nested virtualization for (see scripts/mac-proof/run.sh)
      - name: The walk against a Mac mini server
        run: node scripts/proof-install.mjs --server mac --store plain --out proof-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: install-proof-mac, path: proof-out, retention-days: 14 }

  live-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      # the real relay as transport only; names stay on the stand-in. Reported apart from the stand-in walks.
      - name: The walk over the live relay (a server in this process)
        run: node scripts/proof-install.mjs --server daemon --store plain --live-relay --out proof-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: install-proof-live-relay, path: proof-out, retention-days: 14 }
