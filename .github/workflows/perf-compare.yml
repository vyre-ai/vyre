# Idle perf of vyred at one ref, with the whole perf-check report (the recurring timers under 60 s with their call sites, the settled heap, the CPU samples), three runs on a quiet hosted runner.
# Dispatch it twice, with ref v0.5.7 and with the train tip, and compare the reports. Dispatch only; nothing is changed or published.
name: perf-compare
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The tag, branch or commit to measure"
        required: true
permissions:
  contents: read
jobs:
  idle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the ref
        env:
          REF: ${{ inputs.ref }}
        run: printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' || { echo "::error::not a ref"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - name: three idle runs, whole report
        run: |
          git log -1 --format='ref %h %s'
          for i in 1 2 3; do
            echo "=================== run $i (load $(cut -d' ' -f1-3 /proc/loadavg))"
            node scripts/perf-check 2>&1 || true
          done
