# The Capsule on macOS: the native app, its Swift tests, and the Node tests that only run on a Mac. Built here so no one compiles it on their own Mac.
name: capsule-mac
on:
  push:
    branches-ignore: ["work/*-draft*"]
    paths: ["local/capsule/**", "!local/capsule/native-win/**", ".github/workflows/capsule-mac.yml"]
  pull_request:
    paths: ["local/capsule/**", "!local/capsule/native-win/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capsule-mac-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'work/') && github.ref_name != 'work/stage-0.2' }}
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.mine.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: local
          fetch-depth: 0
      - id: mine
        # A team branch that merged stage sees everyone's files in the push diff, so the path filter
        # alone would build the Mac and Android apps for it. Ask instead what the branch itself changed
        # relative to stage; stage, pull requests and manual runs are not filtered.
        run: |
          echo run=true >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/heads/work/stage-0.2) exit 0 ;;
            refs/heads/work/*) ;;
            *) exit 0 ;;
          esac
          [ "$GITHUB_EVENT_NAME" = push ] || exit 0
          git fetch --no-tags origin work/stage-0.2:refs/remotes/origin/work/stage-0.2 || exit 0
          base=$(git merge-base HEAD origin/work/stage-0.2) || exit 0
          if git diff --name-only "$base" HEAD | grep -Ev '^local/capsule/native-win/' | grep -Eq '^(local/|docs/design/brand/export/lumen/macos/|core/vault/native|core/cli/commands/capsule|scripts/capsule-native-check\.mjs|\.github/workflows/capsule-mac\.yml)'; then exit 0; fi
          echo "this branch changed nothing under the Capsule relative to stage: skipping"
          echo run=false >> "$GITHUB_OUTPUT"
  build:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VYRE_NO_DIALOGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Toolchain
        run: sw_vers && swiftc --version && xcodebuild -version
      - name: Native Capsule tests
        if: hashFiles('local/capsule/native/build.sh') != ''
        env:
          VYRE_CAPSULE_SNAP: ${{ runner.temp }}/lumen-screens
        run: sh local/capsule/native/build.sh test
      - name: Native Capsule app
        # Built even when a native test fails, so the app still comes out and the job still fails.
        if: (success() || failure()) && hashFiles('local/capsule/native/build.sh') != ''
        run: sh local/capsule/native/build.sh app
      - name: Native Capsule driven and measured
        if: always() && hashFiles('local/capsule/native/build.sh') != ''
        timeout-minutes: 6
        env:
          VYRE_CAPSULE_CHECK_DETAIL: "1"
          VYRE_CAPSULE_SCREENS: ${{ runner.temp }}/lumen-screens
        run: node scripts/capsule-native-check.mjs local/capsule/native/.build/Vyre.app
      - name: Lumen against a real vyred
        # The four tools the server now offers (mentions.search, capsule.commands, view, act), read by the built app
        # from a real daemon in a throwaway home: the # list, the module commands, the next-meeting line.
        if: always() && hashFiles('local/capsule/native/build.sh') != ''
        timeout-minutes: 5
        env:
          VYRE_CAPSULE_SCREENS: ${{ runner.temp }}/lumen-screens
        run: |
          npm ci --no-audit --no-fund
          node scripts/capsule-daemon-check.mjs local/capsule/native/.build/Vyre.app
      - name: Lumen on a Mac paired to a server with an assistant
        # #36: a box vyred and a Mac vyred paired through the link harness (a simulated tailnet); the box has the assistant, the Mac
        # has none. The built Lumen must ask the box (@ lists it, a question offers it), say so when the box is away, and keep the
        # Mac's own things local.
        if: always() && hashFiles('local/capsule/native/build.sh') != ''
        timeout-minutes: 8
        env:
          VYRE_CAPSULE_SCREENS: ${{ runner.temp }}/lumen-screens
        run: |
          npm ci --no-audit --no-fund
          node scripts/capsule-paired-check.mjs local/capsule/native/.build/Vyre.app
      - name: Node tests that need a Mac
        run: |
          npm ci --no-audit --no-fund
          node --test --test-reporter=spec "local/*/*.test.js"
      - name: Vyre Local signing on a throwaway keychain
        # Proves the signing path `vyre capsule` offers (capsule-native.js createIdentity). Only the
        # throwaway keychain is written; the runner's login keychain is untouched. Nothing here may
        # wait for input: in the user domain add-trusted-cert asks for a password and hangs the
        # runner, so the runner passed in trusts in the admin domain with `sudo -n -d`, every
        # command reads /dev/null and gets its own timeout, and the step stops at 5 minutes.
        if: (success() || failure()) && hashFiles('core/cli/commands/capsule-native.js') != '' && hashFiles('local/capsule/native/build.sh') != ''
        timeout-minutes: 5
        env:
          KC: ${{ runner.temp }}/vyre-test.keychain-db
        run: |
          set -eu
          exec </dev/null
          unset VYRE_HOME NODE_TEST_CONTEXT
          PW=ci-throwaway
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          node -e '
            import("node:child_process").then(async ({ spawnSync }) => {
              const m = await import("./core/cli/commands/capsule-native.js");
              const runner = (cmd, args, opts = {}) => {
                const o = { encoding: "utf8", ...opts, stdio: ["ignore", "pipe", "pipe"], timeout: 60_000 };
                if (cmd.endsWith("security") && args[0] === "add-trusted-cert") return spawnSync("sudo", ["-n", cmd, "add-trusted-cert", "-d", ...args.slice(1)], o);
                return spawnSync(cmd, args, o);
              };
              const r = m.createIdentity({ runner, keychain: process.env.KC, tmp: process.env.RUNNER_TEMP });
              console.log(JSON.stringify(r)); if (!r.ok) process.exit(1);
            })'
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          APP=local/capsule/native/.build/Vyre.app
          if [ ! -d "$APP" ]; then
            echo "Vyre.app did not build: signing a copy of /bin/echo instead"
            APP="$RUNNER_TEMP/signing-probe"; cp /bin/echo "$APP"
          fi
          codesign --force --sign "Vyre Local" --keychain "$KC" --identifier sh.vyre.capsule "$APP"
          codesign --verify --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority=Vyre Local|Identifier=sh.vyre.capsule"
      - name: Package
        if: success() || failure()
        run: |
          mkdir -p dist
          if [ -d local/capsule/native/.build/Vyre.app ]; then
            ditto -c -k --keepParent local/capsule/native/.build/Vyre.app dist/Vyre-capsule.app.zip
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: capsule-mac-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: lumen-screens-${{ github.sha }}
          path: ${{ runner.temp }}/lumen-screens/*.png
          if-no-files-found: ignore
          retention-days: 14
