# What the Android app looks like on a real Android runtime, on a hosted emulator (never on a person's computer):
# installs the debug APK that android-app.yml built, opens Now, a record and the chat through their vyre:// links,
# and keeps screenshots, a short screen recording of Now and the log as an artifact.
#
#   workflow_dispatch   any time; `run` is an android-app run id, or empty for the latest green run on the same ref
#   workflow_run        after android-app succeeds (GitHub reads a workflow_run trigger from the default branch only, so
#                       it starts once this file is on main; on a team branch use workflow_dispatch)
name: android-app-capture
on:
  workflow_dispatch:
    inputs:
      run:
        description: "android-app run id to take the APK from (empty: the latest green run on this ref)"
        required: false
  workflow_run:
    workflows: [android-app]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: android-app-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Find the debug APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.inputs.run || github.event.workflow_run.id }}
          REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --workflow android-app.yml --branch "$REF" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$RUN" ] || { echo "no green android-app run on $REF"; exit 1; }
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          gh run download "$RUN" --pattern 'android-app-debug-*' --dir apk
          ls -R apk
          echo "the APK of android-app run $RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/app/scripts/capture-android.sh apk/android-app-debug-*/vyre-debug.apk capture-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-capture-${{ github.sha }}
          path: capture-android/
          retention-days: 14
