# app.vyre.run: the hosted web app's loader and its content-addressed builds (ADR 0026 section 10).
# Build the directory with relay/app/release.js (loader, then build) before deploying.
# Deploys only through .github/workflows/relay-deploy.yml (the lead's approval, the deploy environment); no account id lives here.
name = "vyre-app"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "app.vyre.run", custom_domain = true }]

[assets]
directory = "../../app-out"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# Cloudflare keeps request logs, with addresses, whenever this is on; Vyre needs none of them (#70). A specific failure may switch it on for a day, and the privacy page says so.
[observability]
enabled = false
