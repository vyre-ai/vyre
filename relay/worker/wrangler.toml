# The Vyre relay on Cloudflare (ADR 0026, section 2). No account id here: wrangler takes it from
# the logged-in account at deploy. Deploying needs the lead's approval.
name = "vyre-relay"
main = "index.js"
compatibility_date = "2026-09-01"

# Set at deploy, lead approval required.
# routes = [{ pattern = "relay.vyre.run/*", zone_name = "vyre.run" }]

[[durable_objects.bindings]]
name = "ROUTES"
class_name = "RouteRelay"

# One object per Wink pairing ticket locator (ADR 0045), not per route: a resolve request carries
# only a locator, nothing to route it to a specific RouteRelay object by.
[[durable_objects.bindings]]
name = "TICKETS"
class_name = "PairTicket"

# The free plan needs SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RouteRelay", "PairTicket"]

# Per-address limiting for /v1/device. Optional: without it the per-route caps in the DO are the
# only limit, and a rate limiting rule on /v1/device is set on the zone instead. Set at deploy.
# [[ratelimits]]
# name = "DEVICE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }

# Per-address and global limiting for /v1/pair (ADR 0045's Wink resolve). Optional, same as
# DEVICE_LIMITER above: without them the per-route registration cap in RouteRelay is the only
# limit, and a rate limiting rule on /v1/pair is set on the zone instead. Set at deploy.
# [[ratelimits]]
# name = "PAIR_LIMITER"
# namespace_id = "1002"
# simple = { limit = 30, period = 60 }
# [[ratelimits]]
# name = "PAIR_LIMITER_GLOBAL"
# namespace_id = "1003"
# simple = { limit = 600, period = 60 }

[observability]
enabled = true
