# web.vyre.run: the Vyre app on the web, the release's signed web export (relay/web/README.md).
# Build the directory with scripts/build-web-out.mjs (from the release's signed app-out) before deploying.
# Deploys only through .github/workflows/web-deploy.yml (the lead's approval, the deploy environment); no account id lives here.
name = "vyre-web"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "web.vyre.run", custom_domain = true }]

[assets]
directory = "../../web-out"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# Cloudflare keeps request logs, with addresses, whenever this is on; Vyre needs none of them (#70).
[observability]
enabled = false
