<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Nothing is fetched: the fonts are in the app, so the Capsule looks the same with no network. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Vyre Capsule</title>
  <link rel="stylesheet" href="capsule.css">
</head>
<body>
  <div id="cap" class="cap" role="dialog" aria-label="Vyre Capsule">
    <div class="bar" id="bar">
      <svg class="mark" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4L8 13L11.52 7.24" stroke="#F1EEE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle id="dot" cx="13.5" cy="4" r="1.8" fill="#C6F36B"/></svg>
      <div class="field">
        <span id="chip" class="chip" hidden></span>
        <input id="box" type="text" autocomplete="off" spellcheck="false" aria-label="Ask, or @ an agent, project or thread" placeholder="Ask, or @agent">
      </div>
      <span id="hint" class="hint"></span>
    </div>
    <div id="panel"></div>
    <div id="keys" class="keys mono"></div>
  </div>
  <script type="module" src="capsule.js"></script>
</body>
</html>
