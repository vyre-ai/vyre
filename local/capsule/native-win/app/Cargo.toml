[package]
name = "vyre-app-win"
version = "0.1.0"
edition = "2021"
description = "The Vyre Windows app: tray, global hotkey, toasts, autostart, and a WebView2 window on the person's own server. Trust rules live in ../src/shell.rs."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
vyre-capsule-win = { path = ".." }
