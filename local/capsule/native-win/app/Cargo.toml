[package]
name = "vyre-app-win"
version = "0.1.0"
edition = "2021"
description = "The Vyre Windows app: tray, global hotkey, toasts, autostart, and a WebView2 window on the person's own server. Trust rules live in ../src/shell.rs."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
base64 = "0.22"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = "2"
vyre-capsule-win = { path = ".." }
