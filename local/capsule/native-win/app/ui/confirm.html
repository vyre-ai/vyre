<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyre Lumen</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f3ec; --fg:#1d1b17; --mut:#6b665c; --line:#d9d3c5; --acc:#1d1b17; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161512; --fg:#f1ede3; --mut:#9a9486; --line:#302d26; --acc:#f1ede3; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 "Segoe UI Variable Text","Segoe UI",sans-serif; display:grid; place-items:center; min-height:100vh; }
  main { width:min(420px, calc(100vw - 32px)); }
  h1 { font-size:22px; font-weight:600; margin:0 0 8px; }
  p { color:var(--mut); margin:0 0 20px; white-space:pre-line; }
  code { color:var(--fg); }
  button { margin:12px 8px 0 0; padding:10px 16px; font:inherit; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--fg); }
  button.go { color:var(--bg); background:var(--acc); border:0; }
  #err { color:#b3402a; min-height:1.5em; margin-top:8px; }
</style>
<main>
  <h1 id="title">Pair with this server?</h1>
  <p id="detail"></p>
  <button class="go" id="yes">Pair</button><button id="no">Cancel</button>
  <div id="err" role="alert"></div>
</main>
<script src="confirm.js"></script>
