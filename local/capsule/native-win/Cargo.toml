[package]
name = "vyre-capsule-win"
version = "0.1.0"
edition = "2021"
description = "The Windows Capsule shell (Tier C, docs/design/windows-plan.md section 9): a thin Tauri panel hosting Deck's existing web views. Not built yet; this crate starts with the one piece that needs a real decision before any UI goes up, the global hotkey's conflict handling."
publish = false

# The full Tauri app (tray, WebView2 panel, Windows Hello, Authenticode pin) is not scaffolded
# yet; see docs/design/windows-plan.md section 9's Sequencing. This crate starts with `hotkey`,
# a pure, host-independent module with no Tauri or Win32 dependency, so it builds and tests on
# any platform (this Mac's cargo included) even though it only ever runs on win32 in the app.
[lib]
name = "vyre_capsule_win"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
