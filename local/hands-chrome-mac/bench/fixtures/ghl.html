<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harlow Legal CRM</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  nav { background: #123; padding: 10px 24px; }
  nav button { margin-right: 8px; padding: 6px 12px; }
  main { padding: 24px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid #ddd; padding: 4px 8px; text-align: left; cursor: default; }
  .hidden { display: none; }
  .dropdown, .panel { border: 1px solid #999; padding: 8px; margin: 8px 0; background: #fafafa; }
  #modal { position: fixed; left: 20%; top: 20%; width: 400px; background: #fff; border: 2px solid #333; padding: 16px; z-index: 10; }
  #toast { color: #060; }
</style>
</head>
<body>
<nav>
  <button type="button" data-testid="nav-contacts" id="nav-contacts">Contacts</button>
  <button type="button" data-testid="nav-automation" id="nav-automation">Automation</button>
</nav>
<main>
  <section id="contacts-view">
    <h1>Contacts</h1>
    <table data-testid="contacts-table"><thead><tr><th>Name</th><th>Email</th><th>Stage</th></tr></thead><tbody id="contacts-body"></tbody></table>
    <div id="contact-detail" data-testid="contact-detail" class="panel hidden">
      <b id="detail-name"></b>
      <button type="button" data-testid="close-detail" id="close-detail">Close</button>
    </div>
  </section>
  <section id="automation-view" class="hidden">
    <h1>Automation</h1>
    <button type="button" data-testid="create-workflow" id="create-workflow">Create workflow</button>
    <div id="builder" class="panel hidden">
      <label>Workflow name <input id="workflow-name" data-testid="workflow-name"></label>
      <div>
        <button type="button" data-testid="trigger-picker" id="trigger-picker">Choose trigger</button>
        <span id="trigger-label" data-testid="trigger-label">none</span>
        <div id="trigger-list" class="dropdown hidden">
          <button type="button" data-testid="trigger-contact-created" data-trigger="Contact Created">Contact Created</button>
          <button type="button" data-testid="trigger-tag-added" data-trigger="Tag Added">Tag Added</button>
          <button type="button" data-testid="trigger-form-submitted" data-trigger="Form Submitted">Form Submitted</button>
        </div>
      </div>
      <ol id="steps" data-testid="steps"></ol>
      <button type="button" data-testid="add-action" id="add-action">Add action</button>
      <button type="button" data-testid="save-workflow" id="save-workflow">Save</button>
      <span id="toast" data-testid="toast"></span>
    </div>
  </section>
</main>
<div id="modal" data-testid="action-modal" class="hidden" role="dialog">
  <h3>Pick an action</h3>
  <button type="button" data-testid="action-send-email" data-action="Send Email">Send Email</button>
  <button type="button" data-testid="action-send-sms" data-action="Send SMS">Send SMS</button>
  <button type="button" data-testid="action-wait" data-action="Wait">Wait</button>
  <button type="button" data-testid="action-add-tag" data-action="Add Tag">Add Tag</button>
  <p><label>Config <input id="action-config" data-testid="action-config"></label></p>
  <button type="button" data-testid="action-confirm" id="action-confirm">Confirm</button>
</div>
<script>
  window.__AUTH = { token: 'fixture-token-123' };
  window.__state = { saved: false, steps: [], trigger: null, chosen: null };
  function $(id) { return document.getElementById(id); }
  function hide(id, h) { $(id).classList.toggle('hidden', h); }
  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: Object.assign({ 'Authorization': 'Bearer ' + window.__AUTH.token, 'Accept': 'application/json' }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  window.__api = api;
  var contacts = [];
  function renderContacts() {
    var tb = $('contacts-body');
    tb.innerHTML = '';
    contacts.forEach(function (c, i) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><button type="button"></button></td><td></td><td></td>';
      // The row's open control is a real button, as it is a link in the real app: a snapshot lists
      // controls, not table rows.
      var open = tr.children[0].firstChild;
      open.setAttribute('data-testid', 'contact-row-' + i);
      open.textContent = c.name; tr.children[1].textContent = c.email; tr.children[2].textContent = c.stage;
      open.addEventListener('click', function () { $('detail-name').textContent = c.name; hide('contact-detail', false); });
      tb.appendChild(tr);
    });
  }
  api('GET', '/api/contacts?limit=25').then(function (r) { contacts = r.body.data || []; renderContacts(); });
  api('GET', '/api/workflows').then(function () {});
  $('nav-contacts').addEventListener('click', function () { hide('contacts-view', false); hide('automation-view', true); });
  $('nav-automation').addEventListener('click', function () { hide('contacts-view', true); hide('automation-view', false); });
  $('close-detail').addEventListener('click', function () { hide('contact-detail', true); });
  $('create-workflow').addEventListener('click', function () {
    hide('automation-view', false); hide('contacts-view', true); hide('builder', false);
  });
  $('trigger-picker').addEventListener('click', function () { hide('trigger-list', false); });
  document.querySelectorAll('[data-trigger]').forEach(function (b) {
    b.addEventListener('click', function () {
      window.__state.trigger = b.getAttribute('data-trigger');
      $('trigger-label').textContent = window.__state.trigger;
      hide('trigger-list', true);
    });
  });
  $('add-action').addEventListener('click', function () { window.__state.chosen = null; $('action-config').value = ''; hide('modal', false); });
  document.querySelectorAll('[data-action]').forEach(function (b) {
    b.addEventListener('click', function () { window.__state.chosen = b.getAttribute('data-action'); });
  });
  $('action-confirm').addEventListener('click', function () {
    if (!window.__state.chosen) return;
    window.__state.steps.push({ type: window.__state.chosen, config: $('action-config').value });
    var li = document.createElement('li');
    li.textContent = window.__state.chosen + ': ' + $('action-config').value;
    $('steps').appendChild(li);
    hide('modal', true);
  });
  $('save-workflow').addEventListener('click', function () {
    api('POST', '/api/workflows', { name: $('workflow-name').value, trigger: window.__state.trigger, actions: window.__state.steps }).then(function (r) {
      window.__state.saved = r.status === 201;
      $('toast').textContent = window.__state.saved ? 'Saved' : 'Failed';
    });
  });
  window.__reset = function () {
    window.__state = { saved: false, steps: [], trigger: null, chosen: null };
    $('steps').innerHTML = ''; $('toast').textContent = ''; $('trigger-label').textContent = 'none';
    $('workflow-name').value = ''; $('action-config').value = '';
    hide('builder', true); hide('modal', true); hide('trigger-list', true); hide('contact-detail', true);
    hide('automation-view', true); hide('contacts-view', false);
    return true;
  };
</script>
</body>
</html>
