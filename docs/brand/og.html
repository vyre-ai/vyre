<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vyre social image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #0E0D0C; }
  .card { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #0E0D0C; color: #F1EEE6;
    font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; }
  .lockup { position: absolute; left: 80px; top: 80px; display: flex; align-items: center; gap: 12px; }
  .lockup .word { font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
  h1 { position: absolute; left: 80px; top: 228px; width: 680px; margin: 0; font-weight: 700; font-size: 54px;
    line-height: 62px; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 80px; top: 434px; width: 680px; margin: 0; font-size: 23px; line-height: 32px;
    color: #B3AEA4; }
  .url { position: absolute; left: 80px; bottom: 64px; font: 500 20px/24px 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color: #8C877D; }
  .tile { position: absolute; right: 108px; top: 180px; width: 280px; height: 280px; border-radius: 56px;
    background: #171613; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 5.5L12 19.5L17.96 9.69" stroke="#F1EEE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20.5" cy="5.5" r="2.3" fill="#C6F36B"/></svg>
    <span class="word">vyre</span>
  </div>
  <h1>Your agents live on your server. Reach them from your Mac or your phone.</h1>
  <p class="sub">Open-source, self-hosted Claude Code agents. Your keys stay in your own vault.</p>
  <div class="url">vyre.run</div>
  <div class="tile">
    <svg width="118" height="118" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 5.5L12 19.5L17.96 9.69" stroke="#F1EEE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20.5" cy="5.5" r="2.3" fill="#C6F36B"/></svg>
  </div>
</div>
</body>
</html>
