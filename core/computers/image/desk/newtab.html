<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing here calls home: no request leaves this page until a person submits the search box. The page is the agent computer's new tab and home page (Chrome's managed policy, Dockerfile). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; form-action 'none'">
<title>New tab</title>
<style>
  :root { color-scheme: dark; --bg: #0E0D0C; --ink: #F1EEE6; --muted: #A8A39A; --edge: #2C2824; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 "Liberation Sans", system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 24px 6vh; }
  .glow { position: fixed; left: 50%; top: 42%; width: 720px; height: 720px; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(120, 92, 44, .30), rgba(120, 92, 44, 0)); pointer-events: none; }
  svg { width: 132px; height: 132px; position: relative; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: .01em; color: var(--ink); min-height: 31px; }
  h1:empty { visibility: hidden; }
  form { width: min(560px, 100%); position: relative; }
  input { width: 100%; height: 52px; border-radius: 26px; border: 1px solid rgba(241, 238, 230, .16); background: rgba(38, 35, 31, .72); color: var(--ink); font: inherit; font-size: 17px; padding: 0 22px 0 52px; outline: none;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 12px 40px rgba(0, 0, 0, .35); transition: border-color .15s, background .15s; }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: rgba(255, 223, 168, .55); background: rgba(44, 40, 36, .86); }
  form svg { position: absolute; left: 20px; top: 16px; width: 20px; height: 20px; opacity: .6; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="glow"></div>
<main>
  <svg viewBox="0 0 1024 1024" aria-label="Vyre" role="img">
    <defs>
      <linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF7F0"/><stop offset="1" stop-color="#A9A296"/></linearGradient>
      <radialGradient id="bead"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFDFA8"/></radialGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#FFDFA8" stop-opacity=".5"/><stop offset="1" stop-color="#FFDFA8" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="736" cy="320" r="190" fill="url(#halo)"/>
    <path d="M256 330 L496 720 L634 490" fill="none" stroke="url(#v)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="736" cy="320" r="96" fill="url(#bead)"/>
  </svg>
  <h1 id="who"></h1>
  <form id="f" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F1EEE6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="text" placeholder="Search or type a web address" spellcheck="false" autofocus>
  </form>
</main>
<script>
(function () {
  // The agent's name arrives once, in this page's address (?name=...), from the holder that starts Chrome; the page keeps it in this profile's own storage so the plain new tab shows it too.
  var who = "";
  try {
    var given = new URLSearchParams(location.search).get("name");
    if (given) { localStorage.setItem("vyre-agent-name", given.slice(0, 40)); }
    who = localStorage.getItem("vyre-agent-name") || "";
  } catch (e) { /* no storage: the name is simply not shown */ }
  document.getElementById("who").textContent = who.replace(/[^A-Za-z0-9À-ɏ .'-]/g, "").slice(0, 40);
  window.addEventListener("storage", function (e) { if (e.key === "vyre-agent-name") { document.getElementById("who").textContent = String(e.newValue || "").replace(/[^A-Za-z0-9À-ɏ .'-]/g, "").slice(0, 40); } });

  // The halftone field behind it, the welcome screen's dots held still and kept low.
  var c = document.getElementById("field"), x = c.getContext("2d");
  function draw() {
    var w = c.width = innerWidth, h = c.height = innerHeight, g = Math.max(18, Math.round(w / 60)), cx = w / 2, cy = h * .46;
    x.clearRect(0, 0, w, h);
    for (var py = g / 2; py < h; py += g) {
      for (var px = g / 2; px < w; px += g) {
        var w1 = Math.sin(px * .006 + 3.3) + Math.sin(py * .008 - 2.6), w2 = Math.sin((px + py) * .004 + 4.1 + Math.sin(2 + py * .003) * 2);
        var v = Math.pow(Math.max(0, (w1 * .3 + w2 * .7) * .5 + .5), 1.7);
        var qx = (px - cx) / (w * .27), qy = (py - cy) / (h * .4), qd = Math.sqrt(qx * qx + qy * qy);
        v *= .08 + .92 * Math.min(1, Math.max(0, (qd - .7) / .6));
        var a = Math.min(.42, .03 + v * .4);
        if (a < .055) continue;
        var m = Math.min(1, Math.max(0, (w1 * .6 - .15) * 1.6)) * .55;
        x.fillStyle = "rgba(" + Math.round(241 - 57 * m) + "," + Math.round(238 - 74 * m) + "," + Math.round(230 + 25 * m) + "," + a + ")";
        x.beginPath(); x.arc(px, py, .8 + v * 2.4, 0, 6.2832); x.fill();
      }
    }
  }
  draw(); addEventListener("resize", draw);

  // Search: an address goes to that address; anything else goes to Google, Chrome's own default search here (a page cannot ask Chrome for it, so this is the same engine, on a person's Enter).
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = document.getElementById("q").value.trim();
    if (!t) { return; }
    if (/^https?:\/\/\S+$/i.test(t)) { location.assign(t); return; }
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?(\/\S*)?$/i.test(t)) { location.assign("https://" + t); return; }
    location.assign("https://www.google.com/search?q=" + encodeURIComponent(t));
  });
})();
</script>
</body>
</html>
