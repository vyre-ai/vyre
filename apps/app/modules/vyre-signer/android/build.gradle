// The person session's key on Android: Android Keystore, StrongBox where the phone has it.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'sh.vyre'
version = '0.0.1'

android {
  namespace "sh.vyre.signer"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
}
