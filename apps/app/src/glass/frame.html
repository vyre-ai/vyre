<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass screen</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #g, #snap { position: absolute; inset: 0; width: 100%; height: 100%; }
  #snap { object-fit: contain; opacity: .55; pointer-events: none; }
  #snap[hidden] { display: none; }
</style>
</head>
<body>
<div id="g"></div>
<canvas id="snap" hidden aria-hidden="true"></canvas>
<script type="module" src="./frame.js"></script>
</body>
</html>
