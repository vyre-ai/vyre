name: Vyre
options:
  bundleIdPrefix: sh.vyre.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_PREPROCESS: YES
  configs:
    Debug:
      INFOPLIST_PREPROCESSOR_DEFINITIONS: "VYRE_DEBUG=1"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Vyre:
    type: application
    platform: iOS
    sources:
      - path: Vyre
        excludes: ["Info.plist"]
      - path: Shared
    info:
      # XcodeGen writes Vyre/Info.plist from these on every generate: edit here, not the plist.
      path: Vyre/Info.plist
      properties:
        CFBundleDisplayName: Vyre
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [InstrumentSans.ttf, JetBrainsMono.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: sh.vyre.app
            CFBundleURLSchemes: [vyre]
        NSCameraUsageDescription: Vyre uses the camera only to scan the QR code on your Deck's setup page.
        NSFaceIDUsageDescription: Face ID approves what you send, answers sessions and opens the Vault on this phone.
    entitlements:
      path: Vyre/Vyre.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Vyre/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: VyreNotify
      - target: VyreShare
  VyreNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: VyreNotify
        excludes: ["Info.plist"]
      - path: Shared
    entitlements:
      path: VyreNotify/VyreNotify.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app.notify
        INFOPLIST_FILE: VyreNotify/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  VyreShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VyreShare
        excludes: ["Info.plist"]
      - path: Shared
      - path: Vyre/Design
      - path: Vyre/Resources/Fonts
    entitlements:
      path: VyreShare/VyreShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app.share
        INFOPLIST_FILE: VyreShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  VyreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VyreTests
    dependencies:
      - target: Vyre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vyre.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vyre"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Vyre:
    build:
      targets:
        Vyre: all
        VyreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VyreTests
