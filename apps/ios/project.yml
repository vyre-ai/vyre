name: Vyre
options:
  bundleIdPrefix: sh.vyre.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_PREPROCESS: YES
  configs:
    Debug:
      INFOPLIST_PREPROCESSOR_DEFINITIONS: "VYRE_DEBUG=1"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Vyre:
    type: application
    platform: iOS
    sources:
      - path: Vyre
        excludes: ["Info.plist"]
      - path: Shared
    info:
      path: Vyre/Info.plist
    entitlements:
      path: Vyre/Vyre.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Vyre/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: VyreNotify
      - target: VyreShare
  VyreNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: VyreNotify
        excludes: ["Info.plist"]
      - path: Shared
    entitlements:
      path: VyreNotify/VyreNotify.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app.notify
        INFOPLIST_FILE: VyreNotify/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  VyreShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VyreShare
        excludes: ["Info.plist"]
      - path: Shared
      - path: Vyre/Design
      - path: Vyre/Resources/Fonts
    entitlements:
      path: VyreShare/VyreShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app.share
        INFOPLIST_FILE: VyreShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  VyreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VyreTests
    dependencies:
      - target: Vyre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vyre.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vyre"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Vyre:
    build:
      targets:
        Vyre: all
        VyreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VyreTests
