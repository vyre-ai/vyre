<!doctype html>
<!--
  A copy of deck/index.html, not a second shell. core/daemon's serveDeck() serves a directory's
  own index.html when one is asked for, and falls back to the root index.html only when the path
  does not exist at all (core/daemon/index.js:187-192). deck/chat/ is a real directory (index.js,
  nav.js, session.js... are ES modules under it, imported by deck/views/chat.js), so a bare
  request for /chat resolves to this file, not the fallback. js/app.js reads location.pathname
  itself and does not care which file served it, so this only needs to be identical to the root
  shell, never edited separately. /chat/:project and /chat/:project/:thread are not real files, so
  those already fall back to the root index.html on their own; only the bare /chat needed this.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0D0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vyre</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="/css/deck.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="deck" class="shell"></div>
</body>
</html>
