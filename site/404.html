    /* The mark's dot has wandered off too: it circles the middle 0. */
    .orbit { position: absolute; left: 50%; top: 54%; width: 0.92em; height: 0.92em; margin: -0.46em 0 0 -0.46em;
      border-radius: 50%; border: 1px dashed var(--rule-strong); animation: orbit 24s linear infinite; }
    .orbit::after { content: ""; position: absolute; left: 50%; top: 0; width: 0.075em; height: 0.075em; border-radius: 50%;
      background: var(--signal); transform: translate(-50%, -50%); }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit { animation: none; transform: rotate(40deg); } }

    .copy .row { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
    h1 { margin: 0; font-weight: 600; font-size: 44px; line-height: 48px; letter-spacing: -0.03em; }
    .lead { margin: 16px 0 0; max-width: 34em; font-size: 17px; line-height: 26px; color: var(--stone); }

    .capsule { margin: 32px 0 0; max-width: 480px; background: var(--carbon); border: 1px solid var(--rule-strong); border-radius: 10px;
      box-shadow: inset 0 1px 0 rgba(241,238,230,0.06), 0 24px 48px -24px rgba(0,0,0,0.6); }
    .capsule label { display: block; padding: 12px 16px 0; }
    .field { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; }
    .field .p { font: 500 15px/20px var(--mono); color: var(--signal); }
    .field input { flex: 1; min-width: 0; margin: 0; padding: 6px 0; background: transparent; border: 0; color: var(--bone);
      font: 400 16px/22px var(--sans); }
    .field input::placeholder { color: var(--ash); }
    .field input:focus { outline: none; }
    .capsule:focus-within { border-color: var(--signal); }
    .field kbd { font: 500 11px/14px var(--mono); letter-spacing: 0.08em; color: var(--ash); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 6px; }
    .dest { margin: 0; padding: 10px 16px; border-top: 1px solid var(--rule); font: 400 13px/18px var(--mono); color: var(--ash); min-height: 39px; }
    .dest b { font-weight: 500; color: var(--bone); }

    .acts { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 0; }
    .btn { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 6px; text-decoration: none;
      font: 600 13px/18px var(--sans); }
    .btn-signal { background: var(--signal); color: var(--signal-ink); }
    .btn-signal:hover { background: var(--signal-hover); }
    .btn-line { border: 1px solid var(--rule-strong); color: var(--bone); }
    .btn-line:hover { background: var(--raised); }

    .foot { border-top: 1px solid var(--rule); }
    .foot .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 24px; padding-bottom: 24px; }
    .foot a { color: var(--stone); text-decoration: none; font-size: 13px; }
    .foot a:hover { color: var(--bone); }
    .foot nav { display: flex; gap: 20px; }

    @media (max-width: 860px) {

      h1 { font-size: 32px; line-height: 38px; }
      .nav-links { gap: 16px; }
    }

<script>
  // Pure client-side matching. No network, no storage, nothing runs until someone types.
  (function () {
    var PLACES = [
      { name: "the Capsule", href: "/#capsule", words: ["capsule", "ask", "command", "bar"] },
      { name: "Memory", href: "/#memory", words: ["memory", "memories", "remember", "recall", "notes"] },
      { name: "the Vault", href: "/#vault", words: ["vault", "secret", "secrets", "password", "passwords", "keys", "credentials"] },
      { name: "Glass", href: "/#glass", words: ["glass", "watch", "screen", "computer", "takeover"] },
      { name: "Get started", href: "/start", words: ["start", "install", "setup", "set up", "get started", "download", "begin"] },
      { name: "the docs", href: "https://github.com/vyre-ai/vyre#readme", words: ["docs", "doc", "documentation", "readme", "help", "guide"] }
    ];
    var HOME = { name: "home", href: "/" };

    function match(text) {
      var q = String(text || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
      if (!q) return HOME;
      for (var i = 0; i < PLACES.length; i++) {
        var p = PLACES[i];
        for (var j = 0; j < p.words.length; j++) {
          var w = p.words[j];
          if (q.indexOf(w) !== -1 || (q.length >= 2 && w.indexOf(q) === 0)) return p;
        }
      }
      return HOME;
    }

    var form = document.getElementById("go");
    var input = document.getElementById("where");
    var dest = document.getElementById("dest");

    function show(place) {
      dest.textContent = "";
      dest.appendChild(document.createTextNode("Enter takes you to "));
      var b = document.createElement("b");
      b.textContent = place.name;
      dest.appendChild(b);
      dest.appendChild(document.createTextNode("."));
    }

    // A guess from the address that 404'd, so /memry or /docs/install already points somewhere.
    var fromPath = match(location.pathname.replace(/\//g, " "));
    if (fromPath !== HOME) show(fromPath);

    input.addEventListener("input", function () {
      show(input.value.trim() ? match(input.value) : fromPath);
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      location.href = (input.value.trim() ? match(input.value) : fromPath).href;
    });
  })();
</script>
