<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact us</title>
<style>body{font:16px/1.5 system-ui;margin:0;padding:2rem 1rem;display:grid;place-items:start center}form{width:min(30rem,100%);display:grid;gap:.75rem}input,textarea,button{font:inherit;padding:.6rem;border:1px solid #888;border-radius:6px}button{background:#222;color:#fff;border-color:#222}</style>
<form method="post" action="/forms/submit">
  <h1>Tell us how we can help</h1>
  <label>Your name <input name="name" required maxlength="120"></label>
  <label>Your email <input name="email" type="email" required maxlength="200"></label>
  <label>What happened? <textarea name="message" rows="5" maxlength="2000"></textarea></label>
  <button>Send</button>
</form>
</html>
