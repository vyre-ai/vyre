# The egress sidecar: a few sites, in the agents' computers, go out through the user's own Mac.
#
#   COMPOSE_FILE=box/compose.yml:box/compose.egress.yml   (in /srv/vyre/.env, with the rest)
#
# A bank or a court that sees a datacenter address asks questions, or refuses. With config
# glass.egress on, Chrome in each computer gets a proxy script (core/computers/egress.js): the
# listed sites go to SOCKS5 egress:1055, here, and everything else goes out directly as before.
# A listed site has no direct fallback, so when the Mac is asleep or away it fails to load rather
# than showing the datacenter's address after all.
#
# Why a sidecar and not the box's own tailscaled: an exit node applies to a whole node. Set on
# the tailscale service, it would send vyred, its certificates, every agent's model traffic and
# every computer through the Mac. This is a second, separate tailnet node that does nothing but
# use the Mac as its exit node, in userspace (no tun device, no capability), and offer the result
# as a SOCKS5 server on the computers network only. No port is published; nothing outside that
# network reaches it.
#
# Its identity is an ephemeral, pre-authorized auth key tagged tag:vyre-egress, which the user
# makes in the admin console. State lives in memory, so every restart is a fresh ephemeral node
# and a stopped sidecar leaves nothing behind in the tailnet. The tailnet's ACL decides where the
# tag may go: autogroup:internet through the exit node, and nothing else.
#
# The key and the exit node come from /srv/vyre/.env (or the shell), like TS_AUTHKEY and
# DOCKER_GID, and not from vyre.env: the vyre service reads the whole of vyre.env into its own
# environment, where every Claude session would see the key.
#
# Any process in any computer can reach egress:1055, not only Chrome for the listed sites: the
# proxy script is routing, and the ACL is the fence.
#
# UNVALIDATED: written by inspection, never run on the box. See the report to the lead for what
# to check once it is.

services:
  egress:
    image: ${VYRE_TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    # Only where computers run: without them nothing would use it.
    profiles: ["computers"]
    hostname: vyre-egress
    restart: unless-stopped
    labels:
      run.vyre: "1"
    environment:
      - TS_AUTHKEY=${VYRE_EGRESS_AUTHKEY:?set VYRE_EGRESS_AUTHKEY in /srv/vyre/.env to an ephemeral, pre-authorized key tagged tag:vyre-egress}
      - TS_HOSTNAME=vyre-egress
      # No tun device: tailscaled's own network stack, which needs no NET_ADMIN.
      - TS_USERSPACE=true
      - TS_SOCKS5_SERVER=:1055
      # Names are looked up through the exit node too, so the box's resolver never sees which
      # listed site a computer opened.
      - TS_ACCEPT_DNS=true
      # No TS_STATE_DIR: containerboot keeps state in memory (mem:), right for an ephemeral key.
      - TS_EXTRA_ARGS=--exit-node=${VYRE_EGRESS_EXIT_NODE:?set VYRE_EGRESS_EXIT_NODE in /srv/vyre/.env to the Mac's tailnet name or 100.x address} --exit-node-allow-lan-access=false
    read_only: true
    tmpfs:
      # containerboot's socket (TS_SOCKET defaults to /tmp/tailscaled.sock) and tailscaled's scratch.
      - /tmp
      - /var/lib/tailscale
      - /var/run/tailscale
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      # The computers' network, which reaches the internet (the sidecar must reach the control
      # plane and DERP). vyred is on it too, to reach the computers and to answer
      # computers.egress.status, but none of its own traffic goes through here.
      # The service's name, egress, is its address there.
      computers: {}
