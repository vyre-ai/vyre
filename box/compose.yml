# The Vyre box: vyred and the Docker API proxy for agents' computers, nothing else.
#
#   docker compose -f box/compose.yml up -d
#
# Upgrade:  docker compose pull && docker compose up -d
#
# vyred reaches other devices over Wink, a Vyre-owned userspace network core it runs itself (the pinned binaries ship in the image, see
# box/Dockerfile): no sidecar container, no TUN device, no extra capability. The only way in from the host is the onboarding page, which
# Docker binds on the host's loopback.
#
# Room for more, as extra compose files rather than edits here, listed in COMPOSE_FILE in
# /srv/vyre/.env (COMPOSE_PROJECT_NAME=vyre there keeps one project). Other services join the
# `vyre` network, where vyred answers as `vyred`. The agents' computers are the `docker-api`
# service below, under the `computers` profile.

name: vyre

services:
  vyre:
    image: ${VYRE_IMAGE:-ghcr.io/vyre-ai/vyre:latest}
    restart: unless-stopped
    networks:
      vyre:
        aliases:
          - vyred
        # The published onboarding port lands on this network, where vyred binds `vyred`.
        gw_priority: 1
      docker-api: {}
      # Agents' computers join this network, so vyred reaches their screens, computerd and
      # browser ports by container name. It is made here because the proxy refuses NETWORKS.
      computers: {}
    # No `init: true`: the image's tini is PID 1 (box/Dockerfile, ADR 0029 R4).
    # Root, for the spawner only (core/spawner, ADR 0032): it runs vyred as uid vyre (1000) and
    # Vyre-owned Claude sessions as vyre-agent (1001), which cannot open vyred's socket. Every
    # capability is dropped but changing uid and signalling its children. `vyre` in this
    # container drops to uid vyre by itself.
    user: "0:0"
    cap_drop: [ALL]
    # NET_ADMIN and SETPCAP are for the entry script's one-shot step only (core/spawner/wall-entry.sh): it installs the
    # watcher wall's outbound REJECT rule on this namespace, probes it, and replaces itself with the spawner under a bounding
    # set without both, so the serving spawner holds neither. vyred (uid vyre) and every child hold no capability at all.
    cap_add: [SETUID, SETGID, KILL, NET_ADMIN, SETPCAP]
    security_opt:
      - no-new-privileges:true
    labels:
      run.vyre: "1"
    environment:
      - VYRE_HOME=/home/vyre/.vyre
      - VYRE_SUPERVISOR=docker
      # The kernel's sealing process (kernel/seal) runs the server profile on a box: vyred is uid 1000, outside the agents' range
      # (2000 to 2063), and its sealing folder is 0700 under that uid, so no agent session can read it.
      - VYRE_SEAL_PROFILE=server
      # 0.3: the kernel is on, whatever a user's vyre.env says or a root-run update passes on (a packaged box must not depend on a user file; platform's MA-5 refuses a packaged
      # daemon with the kernel off). VYRE_STORE (the Space store) is the installer's choice and the root run passes it on from vyre.env.
      - VYRE_KERNEL=1
    env_file:
      # CLOUDFLARE_VYRE_TOKEN and similar. See vyre.env.example.
      - path: ./vyre.env
        required: false
    volumes:
      # .vyre, .claude and .claude.json live here, so everything survives a recreate.
      - vyre-home:/home/vyre
      # Vyre-owned sessions' own home (their ~/.claude and transcripts), readable by vyred's group.
      - vyre-agent-home:/home/vyre-agent
      # Each signed-in account's own home (uids 2000 to 2063, made in the image, private to the account).
      - vyre-accounts:/home/acct
      # Each session's own temp folder (lib/session-temp.js: <home>.sessions/tmp/<session>), apart from the home so it is not in the home's backups and a killed daemon's leftovers do not ride along.
      - vyre-sessions:/home/vyre/.vyre.sessions
      # Projects.
      - vyre-work:/work
      # docker-api's bearer (core/dockerproxy/bearer.js): vyred (uid vyre, 1000) generates it
      # here on first use and reads it back on every computers.docker request. Shared with the
      # docker-api service below, mode 0400 -- unreadable to vyre-agent (uid 1001), which shares
      # this container's filesystem and network but never this volume's file.
      - docker-api-bearer:/var/lib/vyre-secrets
      # Updates asked for from the Deck (core/update): vyred, and only vyred, drops the one-line file
      # `request` in /var/lib/vyre-update/request (a folder root owns, with root-owned parents); a root path unit on the host (vyre updater install) runs the signed
      # `vyre update` when it appears. Progress and the result come back through /var/lib/vyre-update/status, read-only
      # here: the host writes it and vyred cannot. No socket, no arguments. See box/vyre.
      - ${VYRE_UPDATE_ROOT:-/var/lib/vyre-update}/request:/run/vyre-update
      - ${VYRE_UPDATE_ROOT:-/var/lib/vyre-update}/status:/run/vyre-update-state:ro
      # Spaces' Twenty stores (box/vyre space-helper): vyred drops `req-<id>` files in the spool, a root path unit acts on them from its own copies, and the
      # answers come back as status-<id> files in the read-only folder. No socket, no secret, no path in a request. Linux only; see docs/work/space-helper.md.
      - ${VYRE_SPACES_ROOT:-/var/lib/vyre-spaces}/spool:/run/vyre-spaces
      - ${VYRE_SPACES_ROOT:-/var/lib/vyre-spaces}/status:/run/vyre-spaces-state:ro
      # The release's SHA256SUMS, signature and shell.json, which vyred serves at /release/ for the phone's shell check.
      # On the host, so a recreate of this container keeps them; root writes them (box/vyre publish_release).
      - ${VYRE_UPDATE_ROOT:-/var/lib/vyre-update}/status/release:/opt/vyre/deck/release:ro
    healthcheck:
      test: ["CMD", "vyre", "status"]
      interval: 30s

  # The Docker API for agents' own computers (spec 7.9), and nothing else. Off until
  # `--profile computers`. Vyre's own proxy (core/dockerproxy) holds the host's socket, here and
  # nowhere else; vyred reaches it at http://docker-api:2375 on an internal network that only vyred joins. It allows container create, start, stop, pause, unpause,
  # inspect, list and remove, exec on a computer and volume inspect, and refuses every other
  # endpoint. It reads every body too: a create must pass core/computers/driver/policy.js against
  # the network, image and label prefix below, every per-container op is checked against the
  # labels the Engine itself reports, and what it forwards is its own re-serialisation of what it
  # checked. The socket is read-write because the proxy must write to it; the proxy runs as uid
  # 1000 with the socket's group (DOCKER_GID, which install-box.sh writes to /srv/vyre/.env).
  docker-api:
    image: ${VYRE_IMAGE:-ghcr.io/vyre-ai/vyre:latest}
    command: ["node", "/opt/vyre/core/dockerproxy/main.js"]
    profiles: ["computers"]
    restart: unless-stopped
    # No `init: true`: the image's tini is PID 1 (box/Dockerfile, ADR 0029 R4).
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      run.vyre: "1"
    environment:
      - DOCKER_SOCKET=/var/run/docker.sock
      # What a create may ask for. The same values as vyred's computers.network, computers.image,
      # computers.labelPrefix and computers.capAdd; a create that differs is refused.
      - VYRE_COMPUTERS_NETWORK=${VYRE_COMPUTERS_NETWORK:-vyre-computers}
      - VYRE_COMPUTERS_IMAGE=${VYRE_COMPUTERS_IMAGE:-vyre/computer:0.1}
      - VYRE_COMPUTERS_LABEL_PREFIX=${VYRE_COMPUTERS_LABEL_PREFIX:-run.vyre.computers}
      - VYRE_COMPUTERS_CAP_ADD=${VYRE_COMPUTERS_CAP_ADD:-}
      # Required (core/dockerproxy/main.js refuses to start without it): every request must
      # carry this bearer, so being on the docker-api network is not enough on its own -- a
      # session sharing vyred's container and network cannot reach this proxy just by being on
      # it. vyred writes the file this points at (core/computers/index.js, bearer.ensure); this
      # container only ever reads it, and retries for a while on a first-boot race.
      - DOCKER_PROXY_BEARER_FILE=/var/lib/vyre-secrets/docker-api-bearer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-api-bearer:/var/lib/vyre-secrets:ro
    networks:
      - docker-api

volumes:
  vyre-home:
    labels:
      run.vyre: "1"
  vyre-work:
    labels:
      run.vyre: "1"
  vyre-sessions:
    labels:
      run.vyre: "1"
  vyre-accounts:
    labels:
      run.vyre: "1"
  vyre-agent-home:
    labels:
      run.vyre: "1"
  docker-api-bearer:
    labels:
      run.vyre: "1"

networks:
  vyre:
    name: vyre
    labels:
      run.vyre: "1"
  computers:
    name: vyre-computers
    labels:
      run.vyre: "1"
  docker-api:
    name: vyre-docker-api
    internal: true
    labels:
      run.vyre: "1"
