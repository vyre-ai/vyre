# The Vyre box: vyred and its own tailscaled, nothing else.
#
#   docker compose -f box/compose.yml up -d
#
# Upgrade:  docker compose pull && docker compose up -d
#
# Why a shared network namespace: the vyre service has no network of its own. It runs inside
# the tailscale container's namespace (network_mode: service:tailscale), so vyred sees the real
# tailscale0 interface, binds the tailnet addresses on 443 itself, and identifies every caller
# by `tailscale whois` of the peer address (ADR 0002). There is no `tailscale serve` and no
# identity header: a packet's WireGuard source address is the one thing a local process cannot
# fake.
#
# The tailscale container is the only way in. It has no published port but the onboarding one,
# which Docker binds on the host's loopback. Nothing else on the host, and no other container,
# can reach vyred's tailnet listener except over WireGuard.
#
# Room for more, as extra compose files rather than edits here, listed in COMPOSE_FILE in
# /srv/vyre/.env (COMPOSE_PROJECT_NAME=vyre there keeps one project). Other services join the
# `vyre` network, where vyred answers as `vyred`. The agents' computers are the `docker-api`
# service below, under the `computers` profile. compose.egress.yml is one such extra: a few sites
# in the computers go out through the user's Mac.

name: vyre

services:
  tailscale:
    image: ${VYRE_TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    hostname: ${VYRE_TS_HOSTNAME:-vyre}
    restart: unless-stopped
    labels:
      run.vyre: "1"
    # tailscaled alone, not the image's containerboot: with no auth key, containerboot's own
    # `tailscale up` gives up after a minute and exits, and every restart takes vyred's network
    # (this namespace) down with it. Here tailscaled waits at NeedsLogin for as long as it takes,
    # and vyred runs `tailscale up` when the person presses Connect in the onboarding.
    #
    # vyred runs as uid 1000 and must run `tailscale up` and `tailscale cert`, which tailscaled
    # allows for root and for its operator. tailscaled finds the operator by the connecting uid's
    # name in its own /etc/passwd, and this image has no uid 1000, so it gets one named vyre.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        grep -q '^vyre:' /etc/passwd || echo 'vyre:x:1000:1000:vyre:/nonexistent:/sbin/nologin' >> /etc/passwd
        tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
        pid=$$!
        i=0; until tailscale status >/dev/null 2>&1 || [ "$$(tailscale status 2>&1 | grep -c -i 'logged out\|needslogin')" != 0 ] || [ $$i -ge 30 ]; do i=$$((i+1)); sleep 1; done
        tailscale set --operator=vyre --hostname="$${TS_HOSTNAME}" --accept-dns=false
        if [ -n "$${TS_AUTHKEY}" ]; then tailscale up --authkey="$${TS_AUTHKEY}" --operator=vyre --hostname="$${TS_HOSTNAME}" --accept-dns=false || true; fi
        wait $$pid
    environment:
      - TS_HOSTNAME=${VYRE_TS_HOSTNAME:-vyre}
      # Optional. Empty means interactive login: `tailscale status --json` carries AuthURL once
      # vyred starts the login, and the onboarding page shows it.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # Lets non-root vyred bind 443, in this namespace only.
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
      # Taildrive (core/files/drive.js). tailscaled serves a shared folder itself, from this
      # container, so the folder must be here at the same path as in the vyre service, or the
      # share points at nothing. Only /work: the projects share and Glass's box folders
      # (glass.roots) are chosen inside it. vyre-home is never mounted here, since it holds the
      # vault and Claude's sign-in, and a share serves every file under its folder.
      #
      # Read-only unless VYRE_DRIVE_ACCESS=rw in /srv/vyre/.env: this container runs as root with
      # NET_ADMIN, and read-only keeps it from ever changing a project (ADR 0009's rule, read-only
      # where possible). Set rw only to edit box files from the Mac's Finder, and set vyred's
      # files.drive.access to the same value so the Mac mounts to match. Recreate after a change.
      - vyre-work:/work:${VYRE_DRIVE_ACCESS:-ro}
    ports:
      # The onboarding page, on host loopback only. Reach it with
      # ssh -N -L 7300:127.0.0.1:7300 <user>@<host>
      # The same number on both sides: the page checks its Host header against the port it binds.
      - "127.0.0.1:7300:7300"
    networks:
      vyre:
        aliases:
          - vyred
        # The published onboarding port lands on this network, where vyred binds `vyred`.
        gw_priority: 1
      docker-api: {}
      # Agents' computers join this network, so vyred reaches their screens, computerd and
      # browser ports by container name. It is made here because the proxy refuses NETWORKS.
      computers: {}

  vyre:
    image: ${VYRE_IMAGE:-ghcr.io/vyre-ai/vyre:latest}
    # Shares the tailscale container's namespace; see the note at the top.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    restart: unless-stopped
    init: true
    user: "1000:1000"
    labels:
      run.vyre: "1"
    environment:
      - VYRE_HOME=/home/vyre/.vyre
      - VYRE_SUPERVISOR=docker
      # Binds the onboarding listener to this alias on the vyre network, where Docker delivers
      # the published port; never 0.0.0.0, which would include tailscale0.
      - VYRE_ONBOARD_HOST=vyred
      # Onboarding's Connect runs `tailscale up`; these keep the preferences the entrypoint set.
      - VYRE_TAILSCALE_UP_FLAGS=--accept-dns=false --hostname=${VYRE_TS_HOSTNAME:-vyre}
    env_file:
      # CLOUDFLARE_VYRE_TOKEN and similar. See vyre.env.example.
      - path: ./vyre.env
        required: false
    volumes:
      # .vyre, .claude and .claude.json live here, so everything survives a recreate.
      - vyre-home:/home/vyre
      # Projects.
      - vyre-work:/work
      # The CLI in this image talks to tailscaled through this socket.
      - tailscale-sock:/var/run/tailscale
    healthcheck:
      test: ["CMD", "vyre", "status"]
      interval: 30s

  # The Docker API for agents' own computers (spec 7.9), and nothing else. Off until
  # `--profile computers`. Vyre's own proxy (core/dockerproxy) holds the host's socket, here and
  # nowhere else; vyred reaches it at http://docker-api:2375 on an internal network that only the
  # tailscale/vyred namespace joins. It allows container create, start, stop, pause, unpause,
  # inspect, list and remove, exec on a computer and volume inspect, and refuses every other
  # endpoint. It reads every body too: a create must pass core/computers/driver/policy.js against
  # the network, image and label prefix below, every per-container op is checked against the
  # labels the Engine itself reports, and what it forwards is its own re-serialisation of what it
  # checked. The socket is read-write because the proxy must write to it; the proxy runs as uid
  # 1000 with the socket's group (DOCKER_GID, which install-box.sh writes to /srv/vyre/.env).
  docker-api:
    image: ${VYRE_IMAGE:-ghcr.io/vyre-ai/vyre:latest}
    command: ["node", "/opt/vyre/core/dockerproxy/main.js"]
    profiles: ["computers"]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      run.vyre: "1"
    environment:
      - DOCKER_SOCKET=/var/run/docker.sock
      # What a create may ask for. The same values as vyred's computers.network, computers.image,
      # computers.labelPrefix and computers.capAdd; a create that differs is refused.
      - VYRE_COMPUTERS_NETWORK=${VYRE_COMPUTERS_NETWORK:-vyre-computers}
      - VYRE_COMPUTERS_IMAGE=${VYRE_COMPUTERS_IMAGE:-vyre/computer:0.1}
      - VYRE_COMPUTERS_LABEL_PREFIX=${VYRE_COMPUTERS_LABEL_PREFIX:-run.vyre.computers}
      - VYRE_COMPUTERS_CAP_ADD=${VYRE_COMPUTERS_CAP_ADD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docker-api

volumes:
  tailscale-state:
    labels:
      run.vyre: "1"
  tailscale-sock:
    labels:
      run.vyre: "1"
  vyre-home:
    labels:
      run.vyre: "1"
  vyre-work:
    labels:
      run.vyre: "1"

networks:
  vyre:
    name: vyre
    labels:
      run.vyre: "1"
  computers:
    name: vyre-computers
    labels:
      run.vyre: "1"
  docker-api:
    name: vyre-docker-api
    internal: true
    labels:
      run.vyre: "1"
