# XcodeGen spec for the Vyre AutoFill credential provider, iOS and macOS.
#
#   xcodegen generate
#   xcodebuild -scheme VyreAutofill-iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
#   xcodebuild -scheme VyreAutofill-macOS CODE_SIGNING_ALLOWED=NO build
#   xcodebuild -scheme VyreAutofillCoreTests test
#
# There is no paid Apple Developer team yet (ADR 0028, decision 6), so nothing is signed: the
# simulator and macOS builds compile and link, and the entitlements files wait for a team. The
# generated VyreAutofill.xcodeproj is not checked in.

name: VyreAutofill

options:
  bundleIdPrefix: sh.vyre
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Unsigned until there is a team. The simulator runs unsigned code; a macOS build is made
    # but not installed; a device build needs the team and its provisioning profile.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:

  # ---- iOS ------------------------------------------------------------------------------

  VyreAutofillHost-iOS:
    type: application
    platform: iOS
    sources:
      - path: Host/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: VyreAutofillHost
        PRODUCT_MODULE_NAME: VyreAutofillHost
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.autofill.host
        INFOPLIST_FILE: Host/iOS/Info.plist
        # Needs a paid team to sign (see the file's header).
        CODE_SIGN_ENTITLEMENTS: Host/iOS/VyreAutofillHost.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: VyreAutofill-iOS
        embed: true
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework

  VyreAutofill-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: VyreAutofill
        PRODUCT_MODULE_NAME: VyreAutofill
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.autofill.host.extension
        INFOPLIST_FILE: Extension/iOS/Info.plist
        # Needs a paid team to sign (see the file's header).
        CODE_SIGN_ENTITLEMENTS: Extension/iOS/VyreAutofill.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework

  # ---- macOS ----------------------------------------------------------------------------

  VyreAutofillHost-macOS:
    type: application
    platform: macOS
    sources:
      - path: Host/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: VyreAutofillHost
        PRODUCT_MODULE_NAME: VyreAutofillHost
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.autofill.host
        INFOPLIST_FILE: Host/macOS/Info.plist
        # Needs a paid team to sign (see the file's header).
        CODE_SIGN_ENTITLEMENTS: Host/macOS/VyreAutofillHost.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: VyreAutofill-macOS
        embed: true
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework

  VyreAutofill-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: VyreAutofill
        PRODUCT_MODULE_NAME: VyreAutofill
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.autofill.host.extension
        INFOPLIST_FILE: Extension/macOS/Info.plist
        # Needs a paid team to sign (see the file's header).
        CODE_SIGN_ENTITLEMENTS: Extension/macOS/VyreAutofill.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: LocalAuthentication.framework

  # ---- the pure core's tests: no host app, no device -------------------------------------

  VyreAutofillCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared/AutofillCore.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.vyre.autofill.coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VyreAutofill-iOS:
    build:
      targets:
        VyreAutofillHost-iOS: all
        VyreAutofill-iOS: all
  VyreAutofill-macOS:
    build:
      targets:
        VyreAutofillHost-macOS: all
        VyreAutofill-macOS: all
    test:
      targets:
        - VyreAutofillCoreTests
  VyreAutofillCoreTests:
    build:
      targets:
        VyreAutofillCoreTests: all
    test:
      targets:
        - VyreAutofillCoreTests
